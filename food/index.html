<style>
:root{color-scheme:light;--bg:#FFFFFF;--ink:#1C1C1E;--sub:#6C6C70;--mute:#8E8E93;--faint:#C7C7CC;--line:#E5E5EA;--plate:#F2F2F7;--blue:#0A66D1;--acc:#F26B1D;--accTxt:#B3470A;--red:#C4302B;--p:#0A66D1;--c:#B7791F;--f:#8E44AD;--pad:min(234px,62vw)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
button:focus:not(:focus-visible){outline:none}
:focus-visible{outline:3px solid rgba(10,102,209,.45);outline-offset:2px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:4px;padding:0 14px 0 24px;height:40px;flex:none}
#dayLbl{font-weight:600;font-size:13px;color:var(--sub);padding:8px 0}
/* 오늘 표시: 상단 주황 배지·며칠 전/뒤, 그래프 오늘 칸 띠·알약 */
#dayLbl .tdy{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;padding:2px 9px;margin-right:6px;font-size:12px}
#dayLbl .rel{color:var(--ink);font-weight:700;margin-right:2px}
.ch .tband{fill:var(--acc);fill-opacity:.1}
.ch .tpill{fill:var(--acc)}.ch text.tpt{fill:#fff;font-weight:700}
.sp{flex:1}
.lnk{color:var(--mute);font-size:13px;font-weight:600;text-decoration:none;padding:10px 8px}
#setBtn{width:40px;height:40px;color:var(--mute);display:flex;align-items:center;justify-content:center}
.hero{flex:none;padding:2px 24px 10px;text-align:left;display:block;width:100%}
.big{display:flex;align-items:flex-end;height:68px;font-size:68px;font-weight:700;letter-spacing:-.04em;line-height:1}
.big small{font-size:20px;font-weight:600;letter-spacing:0;color:var(--mute);margin:0 0 8px 6px}
.hero.est .big .roll,.hero.fut .k2 .roll{color:#AEAEB2}
.lbl{color:var(--sub);font-size:13px;margin-top:6px;min-height:1.3em}
.k2{display:flex;align-items:flex-end;height:34px;margin-top:10px;font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1}
.k2 small{font-size:15px;font-weight:600;letter-spacing:0;color:var(--mute);margin:0 0 3px 5px}
.k2 .meta{font-size:14px;font-weight:500;letter-spacing:0;color:var(--sub);margin:0 0 3px 8px;white-space:nowrap}
.k2 .meta b{color:var(--red);font-weight:600}
.kbar{height:4px;border-radius:2px;background:var(--plate);overflow:hidden;margin-top:8px;max-width:260px}
.kbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--acc);transition:width .25s}
.kbar i.over{background:var(--red)}
.coach{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink);margin-top:10px;min-height:1.3em;white-space:nowrap}
.coach::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--faint))}
.hero.kover .k2 .roll{color:var(--red)}
.coachd{margin:0 0 12px;font-size:13px;color:var(--sub);line-height:1.5}.coachd .coach{margin:0 0 2px}
.coach.ok{--dot:#2E9E5B}.coach.lo{--dot:var(--acc)}.coach.hi{--dot:var(--red)}.coach:empty::before{display:none}
/* 굴러가는 숫자 */
.roll{display:inline-flex;align-items:center;height:var(--h);font-variant-numeric:tabular-nums}
.big .roll{--h:68px}.k2 .roll{--h:34px}
.roll .dg{position:relative;width:.6em;height:var(--h);overflow:hidden}
.roll .dg .wp{perspective:700px}
.roll .dg .tr{left:0;right:0;top:50%}
.roll .dg .r{position:absolute;left:0;right:0;height:var(--h);margin-top:calc(var(--h) / -2);display:flex;align-items:center;justify-content:center}
.roll .rs{display:inline-block;width:.28em;text-align:center}
/* 길게 눌러도 글자 선택·돋보기·메뉴가 안 뜨게 (입력칸만 예외) */
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* 30일 창 그래프 — 고른 날이 가운데, 띠가 움직임 (날짜 넘길 때·지난날 볼 때만) */
.ch{flex:none;max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s;padding:0 18px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:ew-resize}
.ch.on{max-height:130px;opacity:1}
.ch .cv{position:relative;width:100%;aspect-ratio:360/118;margin-bottom:8px;overflow:hidden}
.ch .cv svg{position:absolute;left:0;top:0;height:100%;overflow:visible}
.ch .cv .cf{width:100%}
.ch .cv .cs{width:900%;will-change:transform}
.ch .cb{fill:#E5E5EA;transition:fill .15s}.ch .cb.hi{fill:#F3C9C7}.ch .cb.on{fill:var(--acc)}
.ch .tg{stroke:var(--faint);stroke-dasharray:3 3}
.ch .wl2{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .wd{fill:var(--ink)}
.ch .cb.fu{fill:#F2F2F7}.ch .cb.fu.on{fill:#F9C9A8}.ch .wl2.fu{stroke:var(--mute);stroke-dasharray:4 3}
.ch .cv{-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.ch .cl{stroke:var(--ink);stroke-opacity:.18;stroke-width:1.5}
.ch .cs{will-change:transform}   /* 움직임은 JS 물리(runStrip)로 매 프레임 — CSS 전환 없음 */
.ch .cd{transition:transform .22s cubic-bezier(.3,1.35,.5,1),opacity .15s}
.ch .sm{stroke:var(--faint);stroke-dasharray:2 3}
.ch text.tt{fill:var(--ink);font-weight:600}
.ch .cd{fill:#fff;stroke:var(--acc);stroke-width:2.5}
.ch text{font-size:10px;fill:var(--mute)}
#list{flex:1;overflow-y:auto;padding:0 24px 8px;-webkit-overflow-scrolling:touch;border-top:.5px solid var(--line)}
.it{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:.5px solid var(--line)}
.it .tm{grid-row:span 2;color:var(--mute);font-size:13px;padding-top:2px}
.it .nm{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .nm small{color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
.it .kc{font-size:16px;font-weight:600;text-align:right}
.it.gh{opacity:.45;pointer-events:none}
.it .mc{grid-column:2 / span 2;color:var(--mute);font-size:12px;margin-top:2px}
.sum{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border:0;border-bottom:.5px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left}
.sum .sn{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.sum .sn small{color:var(--mute);font-weight:400;font-size:14px}
.sum .sx{color:var(--mute);font-size:13px;white-space:nowrap}
.sum.fu{opacity:.45}
@media (max-height:780px){.sum{padding:8px 0}.sum .sn{-webkit-line-clamp:1}}   /* 낮은 화면: 대표 음식 한 줄 — 안 잘리게 */
.empty{color:var(--mute);font-size:14px;padding:12px 0;line-height:1.5}
.planb{display:block;width:100%;margin:10px 0;padding:10px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-size:16px;font-weight:700}
.planb small{margin-left:8px;font-size:13px;font-weight:400;opacity:.85}
.planb:active{transform:scale(.98)}
.bottom{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 14px 0 24px}
.side{flex:1;display:flex;flex-direction:column;gap:12px;align-self:stretch;justify-content:flex-end;max-width:150px}
.mh{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--sub);margin-bottom:5px}
.mh b{color:var(--ink);font-weight:600}
.mh{flex-wrap:wrap;column-gap:6px;row-gap:0}.mh b{white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--plate);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .25s}
#pB{background:var(--p)}#cB{background:var(--c)}#fB{background:var(--f)}
.bar i.over{background:var(--red)!important}
.pad{flex:none;width:var(--pad);height:var(--pad);padding:8px;border-radius:34px;background:var(--plate);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.k{border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;position:relative;transition:background .1s,transform .1s}
.k.arm{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.k.arm:active,.k.arm.pressed{background:#FDF0E8;color:var(--accTxt);transform:scale(.96)}
.k.cor{color:var(--mute)}
.k.cor:active{background:rgba(0,0,0,.05);color:var(--ink)}
.k:disabled{opacity:.3}
.k.go{border-radius:50%;background:var(--acc);color:#fff;box-shadow:0 6px 14px rgba(242,107,29,.3)}
.k.go:active{transform:scale(.93)}
.k.blank{visibility:hidden}
.k.tdk{color:var(--accTxt)}
.k .dot{position:absolute;top:9px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.pad.jog{background:#FDF0E8}
.bar2{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:.5px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.bar2[hidden]{display:none}
#q{flex:1;height:48px;border-radius:24px;border:0;background:var(--plate);padding:0 18px;font-size:16px;outline:none}
#send{flex:none;width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
/* 원통 공통 */
.wp{position:absolute;inset:0}
.tr{position:absolute;transform-style:preserve-3d}
.r{backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform,opacity}
/* ★ 원통 (덤벨 앱 pwheel처럼 화면 전체, 렌즈 고정) */
.fw{position:fixed;inset:0;z-index:7;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .16s ease-out;touch-action:none;-webkit-user-select:none;user-select:none;--ly:calc(env(safe-area-inset-top) + 34%);--fx:12px;--fwW:min(calc(100% - 24px),320px)}   /* 엄지 안 떼고 쓰니까 원통은 왼쪽 위 — 엄지가 안 가림 */
.fw[hidden]{display:none}.fw.out{opacity:0}
#fwD{position:absolute;inset:0;overflow:hidden;--mk:linear-gradient(to bottom,transparent calc(var(--ly) - 230px),#000 calc(var(--ly) - 120px),#000 calc(var(--ly) + 110px),transparent calc(var(--ly) + 215px));-webkit-mask-image:var(--mk);mask-image:var(--mk)}
#fwD .wp{perspective:2000px;perspective-origin:calc(var(--fx) + var(--fwW) / 2) var(--ly)}
#fwD .tr{left:calc(var(--fx) + 4px);width:calc(var(--fwW) - 8px);top:var(--ly)}
#fwD .r{position:absolute;left:0;right:0;height:58px;margin-top:-29px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px 0 22px;font-size:18px}
#fwD .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fwD .fn small{font-size:13px;color:var(--mute);margin-left:8px}
#fwD .r em{font-style:normal;color:var(--mute);font-size:15px;flex:none}
#fwD .r.cur{font-weight:700}#fwD .r.cur em{visibility:hidden}   /* 렌즈 오른쪽 양·kcal 상자가 대신 보여줌 — 겹쳐 비치지 않게 */
.fw .lens{position:absolute;left:var(--fx);width:var(--fwW);margin-top:-29px;top:var(--ly);height:58px;border-radius:16px;pointer-events:none;background:rgba(242,107,29,.07);box-shadow:inset 0 0 0 1.5px rgba(242,107,29,.26),0 2px 14px rgba(242,107,29,.1)}
/* 양 눈금자: 렌즈 바로 아래, 옆으로 밀 때만 */
#fwR{position:absolute;left:var(--fx);width:var(--fwW);top:calc(var(--ly) + 32px);height:40px;padding-top:4px;background:#fff;pointer-events:none;opacity:0;transition:opacity .12s;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.fw.hz #fwR{opacity:1}.fw.hz #fwD .r:not(.cur){opacity:.15!important}
#fwR .rt{position:absolute;left:50%;top:6px;bottom:0}
#fwR i{position:absolute;top:0;width:1.5px;height:9px;margin-left:-.75px;background:var(--faint)}
#fwR i.b{height:15px;background:var(--mute)}
#fwR em{position:absolute;top:18px;left:0;transform:translateX(-50%);font-style:normal;font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap}
#fwR .nd{position:absolute;left:50%;top:2px;width:3px;height:22px;margin-left:-1.5px;border-radius:2px;background:var(--acc)}
#fwM{position:absolute;right:18px;top:0;bottom:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.15;background:linear-gradient(90deg,transparent,#FEF3EC 18px);padding-left:26px}
#fwM b{font-size:17px;color:var(--ink)}#fwM span{font-size:12px;color:var(--accTxt);font-weight:600}
.fw.mx #fwM b{color:var(--accTxt)}
.fw .lens::before{content:'';position:absolute;left:0;top:15px;bottom:15px;width:3px;border-radius:0 2px 2px 0;background:var(--acc)}
.fwh{position:absolute;left:calc(var(--fx) + 6px);right:12px;top:calc(14px + env(safe-area-inset-top));margin:0;text-align:left;font-size:13px;color:var(--mute)}
.fw.cx .lens{opacity:.25}.fw.cx #fwD{opacity:.35}.fw.cx #fwX{background:var(--ink);color:#fff;transform:scale(1.12)}.fw.cx .fwh{color:var(--ink);font-weight:700}
#fwOk{position:absolute;right:calc(14px + var(--pad) / 2 - 34px);bottom:calc(14px + env(safe-area-inset-bottom) + var(--pad) / 2 - 34px);width:68px;height:68px;border-radius:50%;background:var(--acc);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(242,107,29,.3)}
.fw.tp #fwOk{display:flex}
#fwX{transition:transform .12s,background .12s;position:absolute;right:calc(14px + var(--pad) - 8px - (var(--pad) - 16px) / 6 - 28px);   /* 패드 왼쪽 아래 칸 */bottom:calc(14px + env(safe-area-inset-bottom) + 8px + (var(--pad) - 16px) / 6 - 28px);width:56px;height:56px;border-radius:50%;background:var(--plate);color:var(--sub);display:flex;align-items:center;justify-content:center}
/* 양 가로 원통 */
.hd{position:relative;height:52px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;cursor:ew-resize;-webkit-mask-image:linear-gradient(to right,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(to right,transparent,#000 24%,#000 76%,transparent)}
.hd .hl{position:absolute;top:6px;bottom:6px;left:50%;width:60px;margin-left:-30px;border-radius:12px;background:var(--plate);z-index:0}
.hd .wp{perspective:600px;z-index:1}
.hd .tr{top:0;bottom:0;left:50%}
.hd .r{position:absolute;top:0;bottom:0;width:56px;margin-left:-28px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.hd .r.cur{color:var(--ink)}
.hdl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px;padding:0 4px}
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:480px;max-height:90dvh;border-radius:20px 20px 0 0;background:#fff;color:var(--ink);overflow:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.3)}
dialog.sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.sh{padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 12px}
.sh h2{font-size:18px;margin:0 0 12px}
.cstat{color:var(--sub);font-size:14px;margin-bottom:8px;min-height:1px}
.cstat.busy::after{content:'';display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid var(--faint);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:12px;float:right;margin:0 0 8px 8px}
.cr{padding:10px 0;border-bottom:.5px solid var(--line);clear:both}
.crh{display:flex;gap:8px;align-items:center}
.crh input{flex:1;border:0;background:transparent;font-size:17px;font-weight:600;padding:4px 0;outline:none}
.x{width:36px;height:36px;color:var(--mute);font-size:22px;border-radius:10px}
.crm{display:block;width:100%;text-align:left;color:var(--sub);font-size:14px;padding:4px 0 8px}
.crm b{color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:44px;border-radius:12px;background:var(--plate);font-size:15px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
.ed{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.ed label{font-size:11px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.ed input,.fld input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 8px;font-size:16px}
.cq{margin:12px 0 4px}
.cq p{margin:0 0 8px;font-size:15px;font-weight:600}
.cq .opts{display:flex;flex-wrap:wrap;gap:8px}
.cq .opts button{padding:10px 14px;border-radius:999px;background:var(--plate);font-size:14px}
.ghost{color:var(--accTxt);font-size:15px;font-weight:600;padding:12px 0}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;font-size:14px;color:var(--sub)}
.tot b{font-size:22px;color:var(--ink)}
.row{display:flex;gap:10px;margin-top:8px}
.row button{flex:1;height:52px;border-radius:14px;font-size:16px;font-weight:600}
.b2{background:var(--plate)}
.b1{background:var(--ink);color:#fff}
.b1:disabled{opacity:.35}
.bd{color:var(--red);background:var(--plate)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);margin-bottom:10px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.set h3{font-size:13px;color:var(--mute);font-weight:600;margin:18px 0 8px}
.set p{font-size:13px;color:var(--sub);margin:4px 0 8px;line-height:1.5}
.st{font-size:13px;color:var(--sub)}
.st.err{color:var(--red)}
.chart{width:100%;height:auto;display:block}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat div{background:var(--plate);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--sub)}
.stat b{display:block;font-size:18px;color:var(--ink);margin-top:2px}
/* 화면 높이별 패드 크기·간격: 운동 앱과 똑같이 */
@media (max-height:700px){:root{--pad:min(204px,56vw)}}
@media (max-height:620px){
  #app{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .bottom{padding-top:6px}
  :root{--pad:min(180px,50vw)}
  .pad{padding:6px;gap:5px;border-radius:28px}.k{border-radius:18px}
}
/* 펼친 화면(듀오): 가로 = 왼쪽 숫자·그래프·영양 / 오른쪽 음식 목록, 패드는 오른쪽 아래. 세로 = 칼럼만 넓힘 */
@media (min-width:600px) and (orientation:portrait){#app{max-width:720px}.ch.on{max-height:240px}}
@media (min-width:700px) and (orientation:landscape){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto;column-gap:8px}
  .top{grid-column:1;grid-row:1}
  .hero{grid-column:1;grid-row:2}
  .ch{grid-column:1;grid-row:3;align-self:start}.ch.on{max-height:300px}
  #list{grid-column:2;grid-row:1 / 4;border-top:0;border-left:.5px solid var(--line);padding-top:8px}
  .bottom{grid-column:1 / 3;grid-row:4}
  .side{max-width:220px}
}
#toast{position:fixed;left:50%;bottom:calc(var(--pad) + 40px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:10;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#FFB27F;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<main id="app">
  <div class="top">
    <button id="dayLbl">오늘</button>
    <span class="sp"></span>
    <a class="lnk" href="../">운동</a>
    <button id="setBtn" aria-label="설정"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <button class="hero" id="hero"><div class="big"><span class="roll" id="wRoll" data-dp="1"></span><small>kg</small></div><div class="lbl num" id="lbl"></div><div class="k2"><span class="roll" id="kRoll" data-comma="1"></span><small>kcal</small><span class="meta num" id="kMeta"></span></div><div class="kbar"><i id="kB"></i></div><div class="coach" id="coach"></div></button>
  <div class="ch" id="ch"></div>
  <section id="list"></section>
  <section class="bottom">
    <div class="side">
      <div><div class="mh"><span>단백질</span><b class="num" id="pV"></b></div><div class="bar"><i id="pB"></i></div></div>
      <div><div class="mh"><span>탄수</span><b class="num" id="cV"></b></div><div class="bar"><i id="cB"></i></div></div>
      <div><div class="mh"><span>지방</span><b class="num" id="fV"></b></div><div class="bar"><i id="fB"></i></div></div>
    </div>
    <div class="pad" id="pad" role="group" aria-label="엄지 패드"></div>
  </section>
</main>

<form class="bar2" id="bar" autocomplete="off" hidden>
  <input id="q" placeholder="뭐 먹었어요? 예: 김치찌개, 밥 반공기" enterkeyhint="send">
  <button id="send" aria-label="기록"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</form>
<input type="file" id="file" accept="image/*" hidden>
<div class="fw" id="fw" hidden><div id="fwD"><div class="wp"><div class="tr"></div></div></div><div class="lens"><div id="fwM"></div></div><div id="fwR"></div><button id="fwOk" aria-label="렌즈 음식 기록"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><p class="fwh" id="fwH"></p><button id="fwX" aria-label="닫기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<dialog class="sheet" id="card"><div class="sh">
  <div class="grab"></div>
  <img class="thumb" id="cImg" alt="" hidden>
  <div class="cstat" id="cStat"></div>
  <div id="cItems"></div>
  <div class="cq" id="cQ" hidden></div>
  <button class="ghost" id="cAdd">+ 항목 직접 추가</button>
  <div class="tot"><span id="cMac" class="num"></span><span><b class="num" id="cTot">0</b> kcal</span></div>
  <div class="row"><button class="b2" id="cNo">취소</button><button class="b1" id="cOk">기록</button></div>
</div></dialog>

<dialog class="sheet" id="man"><form class="sh" id="manF" autocomplete="off">
  <div class="grab"></div>
  <label class="fld">kcal<input id="mK" type="number" inputmode="decimal" enterkeyhint="next" required style="height:56px;font-size:24px;font-weight:700;color:var(--ink)"></label>
  <label class="fld">단백질 g (몰라도 돼요)<input id="mP" type="number" inputmode="decimal" enterkeyhint="next"></label>
  <label class="fld">음식 이름 (몰라도 돼요)<input id="mN" maxlength="60" enterkeyhint="done"></label>
  <div class="row"><button type="button" class="b2" id="mNo">취소</button><button class="b1" id="mOk">기록</button></div>
</form></dialog>

<dialog class="sheet" id="edit"><div class="sh">
  <div class="grab"></div>
  <div class="g2"><label class="fld">음식<input id="eN" maxlength="60"></label><label class="fld">양<input id="eA" maxlength="40"></label></div>
  <div class="ed" style="margin:0 0 10px">
    <label>kcal<input id="eK" type="number" inputmode="decimal"></label>
    <label>단백질 g<input id="eP" type="number" inputmode="decimal"></label>
    <label>탄수 g<input id="eC" type="number" inputmode="decimal"></label>
    <label>지방 g<input id="eF" type="number" inputmode="decimal"></label>
  </div>
  <div id="eHdW"></div>
  <div class="row"><button class="bd" id="eDel">삭제</button><button class="b1" id="eOk">저장</button></div>
</div></dialog>

<dialog class="sheet" id="hist"><div class="sh">
  <div class="grab"></div>
  <h2>추세</h2>
  <div id="hBody"></div>
  <div class="row"><button class="b2" id="hClose">닫기</button></div>
</div></dialog>

<dialog class="sheet set" id="set"><div class="sh">
  <div class="grab"></div>
  <h2>설정</h2>
  <h3>목표</h3>
  <div class="seg" id="gSeg"><button data-k="-1">빠른 감량</button><button data-k="-0.5">감량</button><button data-k="0">유지</button><button data-k="0.25">증량</button></div>
  <label class="fld" style="margin-top:12px">몸무게 변화 <b id="gV" style="color:var(--ink);font-size:15px"></b><input type="range" id="gRng" min="-1.5" max="0.75" step="0.05" style="accent-color:var(--acc,#F26B1D)"></label>
  <p id="gInfo"></p>
  <div class="g2" style="margin-top:12px;grid-template-columns:1fr 1fr">
    <label class="fld">단백질 g/kg<input id="sGpk" type="number" inputmode="decimal" step="0.1"></label>
    <label class="fld">시작 소모량 kcal<input id="sT0" type="number" inputmode="numeric" placeholder="자동"></label>
  </div>
  <p>소모량은 기록이 쌓이면 섭취량과 몸무게 추세로 자동 보정돼요. 시작값은 처음 몇 주만 영향 있어요.</p>
  <h3>AI 추정 (Gemini 무료 키 또는 Claude 키)</h3>
  <p class="st" id="aiSt"></p>
  <label class="fld"><input id="sKey" type="password" placeholder="Gemini 키 또는 sk-ant-…" autocomplete="off"></label>
  <div class="row" style="margin-top:0"><button class="b2" id="sKeyOff">키 지우기</button><button class="b1" id="sKeyOk">키 저장</button></div>
  <p>키는 이 기기 브라우저에만 저장돼요. 무료 키는 aistudio.google.com/apikey 에서 받아요. sk-ant- 로 시작하면 Claude로 써요.</p>
  <h3>샘플 데이터</h3>
  <p id="smpSt"></p>
  <div class="row" style="margin-top:0"><button class="b2" id="smpBtn"></button></div>

<script>
(() => {

const $ = (id) => document.getElementById(id);

const MODEL = 'claude-haiku-5-5';

const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const r1 = (n) => Math.round(n * 10) / 10;
const num = (v) => typeof v === 'number' && isFinite(v);
const nn = (v) => { v = Number(v); return isFinite(v) && v >= 0 ? r1(Math.min(v, 20000)) : 0; };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const md = (s) => { const d = pd(s); return (d.getMonth() + 1) + '.' + d.getDate() + ' (' + WD[d.getDay()] + ')'; };

/* ---------- 데이터 ---------- */
function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && Array.isArray(j.foods)) return { foods: j.foods, weights: j.weights || [], deleted: j.deleted || [] }; } catch (e) {}

}
let data = load();
const saveLocal = () => { dataVer++; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
const persist = () => { saveLocal(); queueSync(); };
let cfg = Object.assign({ goal: 'cut', gpk: 1.8, tdee0: 0 }, (() => { try { return JSON.parse(localStorage.getItem(CFGK)) || {}; } catch (e) { return {}; } })());
const saveCfg = () => { try { localStorage.setItem(CFGK, JSON.stringify(cfg)); } catch (e) {} };
const tomb = (id) => { if (!data.deleted.includes(id)) data.deleted.push(id); };
let sel = today(), dataVer = 0;

/* ---------- 몸무게 추세 (지수이동평균 10%) · 적응형 소모량 ---------- */
function trendSeries() {
  const ws = data.weights.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const out = new Map(); if (!ws.length) return out;
  const m = new Map(ws.map((w) => [w.date, w.kg]));
  const end = ws[ws.length - 1].date > today() ? ws[ws.length - 1].date : today();
  /* 안 잰 날은 앞뒤 측정값을 직선으로 이어 채운 뒤 EMA (며칠 쉬어도 추세가 굳지 않음). 마지막 측정 이후는 그대로 */
  let t = ws[0].kg, i = 0;
  for (let d = ws[0].date; d <= end; d = addDays(d, 1)) {
    while (i + 1 < ws.length && ws[i + 1].date <= d) i++;

    if (a.date === d) t += 0.1 * (m.get(d) - t);
    else if (b) t += 0.1 * (a.kg + (b.kg - a.kg) * dayDiff(a.date, d) / dayDiff(a.date, b.date) - t);
    out.set(d, t);
  }

}
/* 날짜 문자열로 시드를 정하는 난수 (mulberry32) */
function rng(seed) { let a = 0; for (const ch of seed) a = Math.imul(a ^ ch.charCodeAt(0), 2654435761); return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* 기록·설정·날짜가 그대로면 다시 계산하지 않음 (길게 눌러 날짜를 빨리 넘길 때 매 프레임 부르므로) */
let modelC = null, modelK = '';
/* 목표 몸무게 변화(kg/주). 설정 cfg.wk(−1.5~+0.75, 0.05 단위). 예전 설정(goal)만 있으면 체중 %로 환산 */
const KMIN = 800;   /* 목표 kcal 바닥 */
function goalKg(W) {
  if (typeof cfg.wk === 'number') return cfg.wk;
  return Math.round(({ cut: -0.005, keep: 0, bulk: 0.0025 }[cfg.goal] || 0) * (W || 70) * 20) / 20;
}
function model() {
  const k = dataVer + '|' + today() + '|' + JSON.stringify(cfg) + '|' + data.foods.length + '|' + data.weights.length;
  if (modelC && k === modelK) return modelC;
  modelK = k; return (modelC = model0());
}
function model0() {
  const tr = trendSeries();
  const W = tr.size ? (tr.get(today()) ?? [...tr.values()].pop()) : null;
  const prior = cfg.tdee0 > 0 ? cfg.tdee0 : (W ? Math.round(W * 31 / 10) * 10 : 2200);
  const T = today(), byDay = kcalByDay(), byReal = kcalByDay(true);
  /* 부분 기록(끼니를 빠뜨린 날): 그날 앞 7일·뒤 7일 기록일 중앙값(각 3일 이상) 중 낮은 쪽의 60% 미만이면 소모량·예상 계산에서 뺌.
     한쪽만 있으면 그쪽, 둘 다 없으면 지난 60일 중앙값. 식단을 확 줄여도 며칠 안에 새 식단을 '평소'로 봄(60일 기준이면 한 달 넘게 걸림) */

  const med = rec.length >= 5 ? rec[rec.length >> 1] : 0;
  const side = (d, s) => { const a = []; for (let i = 1; i <= 7; i++) { const v = byReal.get(addDays(d, s * i)); if (v) a.push(v); } return a.length >= 3 ? a.sort((x, y) => x - y)[a.length >> 1] : null; };

  const okK = (v, d) => v >= medAt(d) * 0.6;

  /* 실제 소모량 = 28일 창의 온전한 기록일 평균 섭취 − 추세 변화×7700/일수.
     창 끝(anchor) = 마지막 몸무게 이전의 가장 최근 기록일 중, 끝 14일에 온전한 기록일이 6일 이상인 날.

  let lastW = ''; data.weights.forEach((w) => { if (w.date > lastW) lastW = w.date; });

  const target = Math.max(KMIN, Math.round((tdee + (W ? gk * 7700 / 7 : 0)) / 10) * 10);
  const P = Math.round((W || 70) * cfg.gpk), F = Math.round(target * 0.25 / 9), C = Math.max(0, Math.round((target - 4 * P - 9 * F) / 4));
  /* 몸무게 기준 하루 kcal 조정(양수 = 더 먹어야 함): 최근 14일 추세 속도 vs 목표 속도. 14일 중 3번 이상 잰 경우만 */
  let wN = 0; data.weights.forEach((x) => { if (x.date > addDays(T, -14) && x.date <= T) wN++; });
  const r14 = W && wN >= 3 && tr.has(addDays(T, -14)) ? (W - tr.get(addDays(T, -14))) / 2 : null;
  const dW = r14 == null ? null : Math.max(-600, Math.min(600, (rate * W - r14) * 7700 / 7));
  const wk = W && tr.has(addDays(today(), -7)) ? W - tr.get(addDays(today(), -7)) : null;
  /* 앞으로 30일 예상: 지난 1개월(30일) 중 기록한 날 하나를 골라(같은 요일 75%) 그날처럼 먹는다고 보고 ±8% 흔들어 kcal를 만듦.
     몸무게 추세는 (예상 섭취 − 소모량)÷7700 씩 쌓음. 날짜로 시드를 정해 다시 그려도 같은 값 */
  /* 최근 7일(어제까지) 온전한 기록일 평균 — 3일 이상일 때만. 한 줄 코칭(더/덜 먹기) 기준 */
  let s7 = 0, n7 = 0; for (let i = 1; i <= 7; i++) { const d = addDays(T, -i); if (byReal.has(d) && okK(byReal.get(d), d)) { s7 += byReal.get(d); n7++; } }
  const t0 = T, avgK = n7 >= 3 ? s7 / n7 : null, past = [], sim = new Map();
  for (let i = 1; i <= 30; i++) { const d = addDays(t0, -i); if (byDay.has(d) && okK(byDay.get(d), d)) past.push(d); }
  let slope = 0;
  if (past.length) {
    let wt = W;
    for (let i = 1; i <= 30; i++) {
      const d = addDays(t0, i), r = rng(d), wd = pd(d).getDay(), same = past.filter((x) => pd(x).getDay() === wd);
      const pool = same.length >= 3 && r() < 0.75 ? same : past, src = pool[Math.floor(r() * pool.length)];

}

/* ---------- 원통(드럼): 덤벨 앱 운동 바퀴와 같은 3D 원통. 렌즈는 제자리, 줄만 원통 둘레로 굴러감 ----------
   el 안에 .wp > .tr > 줄(.r)들. o: h(칸 크기), step(칸당 각도), axis 'y'면 가로로 굴러감, loop, start, drag(직접 끌기), onPick(i, 확정?) */
/* ---------- 효과음: 덤벨 앱과 같은 합성 소리 (Web Audio, 파일 없음) ----------
   설정(켜기·질감)은 덤벨 앱과 같은 localStorage 키를 같이 씀(같은 출처). 덤벨에서 바꾸면 여기도 바뀜.

function audio() {
  try { if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); } if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
  return actx;
}
const SNDK = 'dumbbell-sound', SMIXK = 'dumbbell-sound-mix';
let soundOn = lsGet(SNDK) !== 'off', sfxP = null, actx = null;

const og = () => (1 - sMixF / 100) * 2, fg = () => (sMixF / 100) / 0.7;

    const cv = a.createConvolver(); cv.buffer = ir; const vlp = a.createBiquadFilter(); vlp.type = 'lowpass'; vlp.frequency.value = 1800;
    const vin = a.createGain(); vin.connect(cv); cv.connect(vlp); vlp.connect(out);
    const ein = a.createGain(), dl = a.createDelay(2), fb = a.createGain(), lp = a.createBiquadFilter();

  if (verb) { const s = a.createGain(); s.gain.value = verb; g.connect(s); s.connect(sfxP.vin); }

function sEnv(e, t, g, at, d) { e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(Math.max(g, 0.0002), t + at); e.gain.exponentialRampToValueAtTime(0.0001, t + at + d); }

function sub(t, f, to, g, d, out) { if (g >= 0.001) sOsc(t, f, to, g, 0.012, d, out); }
function hum(t, f, g, d, out, at) {   /* 거의 같은 음 여러 개 → 천천히 일렁이는 맥놀이 */

  const block = (a) => a.length ? '\n' + a.map((x) => '    ' + JSON.stringify(x)).join(',\n') + '\n  ' : '';
  return '{\n' + Object.keys(head).map((k) => '  ' + JSON.stringify(k) + ': ' + JSON.stringify(head[k])).join(',\n') +
    ',\n  "foods": [' + block(fs) + '],\n  "weights": [' + block(ws) + '],\n  "deleted": ' + JSON.stringify(data.deleted) + '\n}\n';
}
async function sync(force) {
  if (!lsGet(TOKK)) return;
  if (syncing) { syncAgain = true; return; }
  clearTimeout(syncTimer); syncTimer = null; syncing = true; syncErr = ''; showSync('저장 중…');
  try {
    for (let tries = 0; ; tries++) {
      const p = await ghPull();
      if (merge(p.doc)) render();
      const remoteKey = p.doc ? stateKey((p.doc.foods || []).filter(okF).map(pickF), (p.doc.weights || []).filter(okW).map(pickW), (p.doc.deleted || []).filter((x) => typeof x === 'string')) : null;
      if (!force && remoteKey === stateKey(realF(), realW(), data.deleted)) break;
      const r = await ghApi('PUT', { message: '식단 기록 ' + today() + ' · 음식 ' + realF().length + ' · 몸무게 ' + realW().length, content: b64e(docText()), branch: GH.branch, ...(p.sha ? { sha: p.sha } : {}) });
      if (r.ok) break;
      if ((r.status === 409 || r.status === 422) && tries < 2) continue;
      throw r.status;
    }
    syncAt = new Date().toISOString(); lsSet(SYNCK, syncAt);
  } catch (e) {
    syncErr = e === 401 || e === 403 ? '토큰을 확인해 주세요' : e === 404 ? '저장소/브랜치를 찾지 못했어요' : '저장 실패 · 다음에 다시 시도해요';
    if (e === 401 || e === 403) toast('GitHub 저장 실패: ' + syncErr);
  }
  syncing = false; showSync();
  if (syncAgain) { syncAgain = false; queueSync(0); }
}
function queueSync(ms) { if (!lsGet(TOKK)) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), ms == null ? 1500 : ms); }
function showSync(busy) {
  const on = !!lsGet(TOKK), st = $('ghSt');
  $('tokF').hidden = on; $('sTokOff').hidden = !on;
  $('sTokOk').textContent = on ? '지금 저장' : '연결';
  st.className = 'st' + (syncErr ? ' err' : '');
  if (!on) st.textContent = '연결 안 됨 · 운동 앱에서 연결했다면 자동으로 같이 써요';
  else if (busy) st.textContent = busy;
  else if (syncErr) st.textContent = syncErr;
  else if (syncAt) { const d = new Date(syncAt); st.textContent = '마지막 저장 ' + md(dstr(d)) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  else st.textContent = '연결됨';
}
$('sTokOk').addEventListener('click', async () => {
  const v = $('sTok').value.trim();
  if (!lsGet(TOKK)) { if (!v) return; lsSet(TOKK, v); $('sTok').value = ''; }
  await sync(true); toast(syncErr ? 'GitHub 저장 실패: ' + syncErr : 'GitHub에 저장했어요');
});
$('sTokOff').addEventListener('click', () => { lsSet(TOKK, ''); lsSet(SYNCK, ''); syncAt = ''; syncErr = ''; showSync(); toast('GitHub 연결을 해제했어요 (운동 앱도 같이 해제돼요)'); });

/* 홈 화면 앱은 메모리에 남아 있어 다시 열어도 새로 안 불러옴 → 앱으로 돌아올 때 서버의 이 파일이 처음 열 때와 달라졌으면 새로고침.
   ?v=시각 + no-store 로 GitHub Pages 캐시(10분)도 건너뜀. 글 쓰는 중이거나 몸무게 모드면 다음 번에 */
let selfSrc = null;
const fetchSelf = () => fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : null)).catch(() => null);
fetchSelf().then((t) => { selfSrc = t; });
async function checkUpdate() {
  if (selfSrc == null) return;
  const t = await fetchSelf();
  if (!t || t === selfSrc || document.visibilityState !== 'visible' || mode !== 'main' || !$('bar').hidden) return;
  if (syncTimer) await sync(false);
  location.reload();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (sel !== today() && !dayFoods(sel).length) sel = today(); render(); queueSync(0); checkUpdate(); }
  else if (syncTimer) sync(false);
});
/* ---------- 샘플 데이터 (sample: true — GitHub에 안 올라감, 설정에서 한 번에 지움) ----------
   지난 60일: 하루 3~4끼 한국식 식사, 평균 약 1,850kcal(주말 더 많이), 몸무게는 그 적자에 맞게 75.2 → 약 71.7kg + 하루 ±0.4 출렁임, 80% 날만 잼 */
const SMEALS = {
  b: [['그릭요거트+그래놀라', '1컵', 280, 16, 34, 8], ['계란 2개+토스트', '1접시', 340, 18, 30, 15], ['바나나+프로틴', '1잔', 250, 26, 30, 3], ['오트밀', '1그릇', 300, 11, 50, 6], ['김밥', '1줄', 420, 12, 64, 12]],
  l: [['김치찌개+공기밥', '1인분', 640, 26, 80, 22], ['제육볶음 정식', '1인분', 780, 32, 90, 30], ['닭가슴살 샐러드', '1접시', 420, 38, 22, 18], ['비빔밥', '1그릇', 620, 22, 92, 16], ['쌀국수', '1그릇', 520, 24, 80, 10], ['돈까스', '1인분', 860, 30, 88, 40]],
  d: [['연어 포케', '1그릇', 560, 32, 62, 18], ['된장찌개+공기밥', '1인분', 580, 24, 82, 14], ['닭가슴살+고구마', '1접시', 450, 42, 50, 6], ['삼겹살+쌈', '1인분', 920, 38, 20, 74], ['순두부찌개+공기밥', '1인분', 600, 26, 80, 18], ['치킨', '반 마리', 1100, 70, 40, 72]],
  s: [['아메리카노', '1잔', 10, 1, 1, 0], ['프로틴 쉐이크', '1잔', 130, 25, 4, 2], ['바나나', '1개', 105, 1, 27, 0], ['아몬드', '한 줌', 170, 6, 6, 15], ['라떼', '1잔', 190, 10, 15, 9]]
};
function seedSample() {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const t = today(), realF = new Set(data.foods.filter((f) => !f.sample).map((f) => f.date)), realW = new Set(data.weights.filter((w) => !w.sample).map((w) => w.date));
  let w = 75.2;
  for (let i = 60; i >= 1; i--) {
    const d = addDays(t, -i), day = pd(d), wkend = day.getDay() === 0 || day.getDay() === 6;
    let kcal = 0;
    if (!realF.has(d)) {
      const meals = [[8, 'b'], [12.5, 'l'], [19, 'd']]; if (rnd() < 0.7) meals.push([15.5, 's']); if (wkend && rnd() < 0.5) meals.push([21.5, 'd']);
      meals.forEach(([h, k], j) => {
        if (k === 'b' && rnd() < 0.15) return;   /* 가끔 아침 거름 */
        const [name, amt, kc, p, c, f] = pick(SMEALS[k]), ts = day.getTime() + (h - 12) * 36e5 + Math.round(rnd() * 40) * 6e4;
        data.foods.push({ id: 'smp' + i + '_' + j, date: d, ts, name, amt, kcal: kc, p, c, f, src: 'manual', u: ts, sample: true }); kcal += kc;
      });
    } else kcal = 1850;
    w += (kcal - 2300) / 7700;
    if (!realW.has(d) && rnd() < 0.8) data.weights.push({ id: 'smpw' + i, date: d, kg: r1(w + (rnd() - 0.5) * 0.8), u: day.getTime(), sample: true });
  }
  saveLocal();
}
const hasSample = () => data.foods.some((f) => f.sample) || data.weights.some((w) => w.sample);
function clearSample() { data.foods = data.foods.filter((f) => !f.sample); data.weights = data.weights.filter((w) => !w.sample); saveLocal(); }
/* 처음 열었는데 기록이 하나도 없으면 샘플로 채워서 화면이 어떻게 움직이는지 바로 보이게 */
if (!data.foods.length && !data.weights.length) seedSample();


render();
queueSync(0);
})();
