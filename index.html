<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>덤벨 세트 기록</title>
<style>
/* VOICE: 조용한 집중 — 지금 들 무게 하나만 크게
   IDEA: 운동기구 옆 기록 카드. 펼치면 왼쪽 페이지는 지도(순서·추세), 오른쪽 페이지는 지금 할 일
   PICTURE: 거대한 "20 kg × 9 회" + 오른쪽 아래 3×3 엄지 패드
   COLOUR/TYPE: 흰 바탕, 잉크 #1C1C1E, 행동=파랑, 향상=초록 / 시스템 산세리프 4단계
   LAYOUT: 접힘=한 열 압축, 기본=한 열, 펼침=두 페이지(가운데 접힘선 비움) */
:root{--bg:#FFFFFF;--ink:#1C1C1E;--sub:#6C6C70;--mute:#8E8E93;--faint:#C7C7CC;--line:#E5E5EA;--plate:#F2F2F7;--blue:#0A66D1;--green:#248A3D;--greenTxt:#1E6E31;--pad:min(234px,62vw)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(10,102,209,.45);outline-offset:2px}
.app{height:100vh;height:100dvh;touch-action:pan-y}
.pageL{display:none}
.pageR{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom))}

/* context */
.ctx{padding:0 24px;display:flex;flex-direction:column;gap:8px;flex:none}
.ctx-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.daypos{border:0;background:transparent;padding:6px 0;font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:4px}
.bars{display:flex;gap:4px}
.bars i{display:block;height:4px;border-radius:2px;background:var(--line)}
.bars i.d{background:var(--ink)}.bars i.c{background:var(--blue)}.bars i.p{background:#9A9AA0}
.daybars{width:150px;gap:3px}.daybars i{flex:1}
.ic{flex:none;display:block}.ic .a{fill:var(--ac)}
.exhead{display:flex;align-items:center;gap:12px}
.extile{flex:none;width:52px;height:52px;border-radius:15px;background:#EAF2FD;display:flex;align-items:center;justify-content:center}
.ctx h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.setrow{display:flex;align-items:center;gap:10px}
.setbars i{width:22px;height:6px;border-radius:3px}
.setrow span{font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}

/* hero */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:12px 24px;overflow:hidden}
.nums{display:flex;align-items:baseline;gap:.08em;font-size:104px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.nums input{width:1.2em;border:0;background:transparent;padding:0;font-size:1em;font-weight:700;letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;border-radius:12px;font-family:inherit}
.nums input::-webkit-outer-spin-button,.nums input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nums input:focus{background:var(--plate);outline:none}
.nums .u{font-size:.23em;font-weight:600;color:var(--mute);margin-right:.18em}
.nums .x{font-size:.38em;font-weight:300;color:var(--faint);margin:0 .12em 0 .02em}
.nums .bw{font-size:.62em;font-weight:800;letter-spacing:-.03em;line-height:1}
.nums .up{color:var(--green)}
.tick{animation:tick .18s ease-out}
@keyframes tick{from{transform:translateY(-5px);opacity:.6}to{transform:none;opacity:1}}
.delta{margin:0;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
.delta.up,.delta.same{color:var(--greenTxt)}.delta.hold{color:var(--ink)}.delta.down{color:#9A3D00}.delta.retry,.delta.first,.delta.bw{color:#0A4FA3}
.why{margin:0;font-size:13px;line-height:1.55;color:var(--sub)}
.delta .pct{font-style:normal;margin-left:4px;padding:1px 8px;border-radius:999px;box-shadow:inset 0 0 0 1.5px currentColor;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.why .ago{color:var(--mute)}
.rule{margin:0;font-size:12px;line-height:1.5;color:var(--sub)}.rule:empty{display:none}
.sgx{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--plate)}.sgx b{font-size:13px}.sgx p{margin:0;font-size:12px;line-height:1.55;color:var(--sub)}

/* trend row (single column only) */
.trend{flex:none;margin:0 24px;display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);background:transparent;text-align:left}
.trend b{font-size:12px;font-weight:700;white-space:nowrap}
.tk-up{color:var(--greenTxt)}.tk-fast{color:#0A4FA3}.tk-flat{color:#7A5600}.tk-down{color:#B0241A}.tk-hold{color:var(--sub)}
.vstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vstats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.vstats div{background:var(--plate);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;container-type:inline-size}
.vstats span{font-size:11px;color:var(--sub);white-space:nowrap}
.vstats b{font-size:min(17px,18cqi);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vscale{display:flex;flex-direction:column;gap:3px}
.vbar{position:relative;display:flex;height:8px;border-radius:4px;overflow:visible}
.vbar i{height:100%;opacity:.22}.vbar i.on{opacity:.9}
.vbar i:first-child{border-radius:4px 0 0 4px}.vbar i:last-of-type{border-radius:0 4px 4px 0}
.z-down{background:#C4281C}.z-flat{background:#B07A00}.z-up{background:#248A3D}.z-fast{background:#0A66D1}
.vbar em{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.vlab{display:flex;font-size:10px;color:var(--mute)}.vlab span{text-align:center;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
.trend svg{flex:1;height:24px}
.trend span{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}

/* bottom */
.bottom{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 14px 0 24px}
.side{flex:1;display:flex;flex-direction:column;align-self:stretch;max-width:150px}
.lab{font-size:12px;font-weight:600;color:var(--mute);padding-bottom:6px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:8px 0;border:0;border-top:.5px solid var(--line);background:transparent;font-variant-numeric:tabular-nums;text-align:left}
.lrow:last-of-type{border-bottom:.5px solid var(--line)}
.lrow small{font-size:12px;color:var(--mute)}
.lrow b{font-size:17px}
.lrow.c small,.lrow.c b{color:var(--blue)}
.lrow.e b{color:var(--faint)}
.next{margin:14px 0 0;font-size:12px;line-height:1.5;color:var(--mute)}
.next b{display:block;color:var(--ink);font-weight:600}

.pad{flex:none;width:var(--pad);height:var(--pad);padding:8px;border-radius:34px;background:var(--plate);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.k{border:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11px;font-weight:700;transition:background .1s,transform .1s}
.k.arm{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.k.arm:active,.k.arm.pressed{background:#E9E9EE;transform:scale(.96)}
.k.arm:disabled{background:transparent;color:var(--faint);box-shadow:none}
.k.cor{background:transparent;color:var(--mute)}
.k.cor:active{background:#E5E5EA}
.k.cor:disabled{opacity:.35}
.k.go{border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(10,102,209,.3)}
.k.go:active{transform:scale(.93)}
.k.go.next{background:var(--green);box-shadow:0 6px 14px rgba(36,138,61,.3),0 0 0 6px rgba(36,138,61,.14)}
.k.go.idle{background:var(--faint);box-shadow:none}
.k.hint{color:var(--green)}
.k.hint svg{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:none}}
.edge{animation:edge .22s}
@keyframes edge{0%,100%{transform:none}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.slide-n{animation:sn .28s ease-out}.slide-p{animation:sp .28s ease-out}
@keyframes sn{from{transform:translateX(36px);opacity:.2}to{transform:none;opacity:1}}
@keyframes sp{from{transform:translateX(-36px);opacity:.2}to{transform:none;opacity:1}}

/* done overlay */
.done{position:absolute;left:0;right:0;top:0;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 24px 0;display:flex;flex-direction:column;gap:16px;z-index:3;animation:fade .2s ease-out;overflow:hidden}
.done[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.done .chk{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin-top:28px;flex:none;animation:pop .4s ease-out}
.done h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
.dsets{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dsets div{display:flex;flex-direction:column;gap:2px}
.dsets small{font-size:12px;color:var(--mute)}
.dsets b{font-size:22px}
.dnext{margin-top:8px;padding:14px 16px;border-radius:18px;background:var(--plate);display:flex;align-items:center;gap:12px}
.dnext>div{flex:1}
.dnext small{display:block;font-size:12px;font-weight:600;color:var(--sub)}
.dnext b{font-size:18px}
.dnext em{font-style:normal;flex:none;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.dprog{height:3px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.dprog i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left;animation:prog 1.6s linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* left page (unfolded) */
.lp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lp-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.lp-head span{font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.exlist{display:flex;flex-direction:column;overflow:auto;min-height:0}
.xrow{display:grid;grid-template-columns:20px 28px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:38px;border:0;border-bottom:.5px solid var(--line);background:transparent;text-align:left;padding:0 6px;border-radius:0;font-size:15px}
.xrow i{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.xrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow em{font-style:normal;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.xrow.ok span{color:var(--mute)}.xrow.ok em{color:var(--greenTxt);font-weight:700}
.xrow.cur{background:var(--plate);border-radius:12px;border-bottom-color:transparent}
.xrow.cur span{font-weight:700}.xrow.cur em{color:var(--blue);font-weight:700}
.lp-trend{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:.5px solid var(--line)}
.lp-trend .t1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lp-trend .t1 b{font-size:15px}
.lp-trend .t1 span{font-size:12px;color:var(--sub)}
.lp-trend svg{display:block}

/* toast */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,calc(-100% - 60px));visibility:hidden;transition:transform .25s ease,visibility 0s .25s;z-index:10;background:rgba(28,28,30,.95);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease}

/* dialogs */
dialog{border:0;border-radius:22px;padding:0;width:min(400px,calc(100% - 24px));max-height:calc(100% - 48px);box-shadow:0 20px 50px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.3)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:17px;font-weight:700}
.dlg .sub{font-size:13px;color:var(--sub);margin-top:-10px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step label{font-size:15px;font-weight:600}
.step .ctl{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:0;background:var(--plate);font-size:20px;font-weight:600}
.step input{width:72px;height:44px;text-align:center;border:0;border-radius:12px;background:var(--plate);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{min-height:48px;border-radius:14px;border:0;font-size:16px;font-weight:600;background:var(--plate)}
.btn.pri{background:var(--blue);color:#fff}.btn.del{grid-column:1/-1;background:#FDECEA;color:#B0241A}.btn.wide{grid-column:1/-1}
.trend-more{margin:0;font-size:12px;line-height:1.6;color:var(--sub)}
.link{border:0;background:transparent;color:var(--blue);font-size:14px;min-height:44px}
.sync{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--plate)}
.sync-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sync-h b{font-size:15px}.sync-h span{font-size:12px;color:var(--sub);text-align:right}
.sync-h span.err{color:#B0241A;font-weight:600}
.sync-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.sync-f input{height:44px;border:0;border-radius:12px;background:#fff;padding:0 12px;font-size:15px}
.sync-f .btn{min-height:44px;padding:0 16px}
.sync-a{display:flex;justify-content:space-between}
.sync-a[hidden],.sync-f[hidden]{display:none}

/* history (read-only) */
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 12px;border:0;border-radius:17px;background:#EAF2FD;color:var(--blue);font-size:13px;font-weight:700;white-space:nowrap}
.lh{display:flex;justify-content:space-between;align-items:center;gap:10px}
#hist{width:100%;max-width:640px;height:100%;max-height:none;margin:0 auto;border-radius:0;box-shadow:none;background:var(--bg);overflow:hidden}
#hist[open]{display:flex;flex-direction:column}
#hist::backdrop{background:var(--bg)}
.hh{flex:none;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:.5px solid var(--line)}
.hh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hh-top h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.hx{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--plate);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.hx:disabled{opacity:.35}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:2px;border-radius:11px;background:var(--plate)}
.seg button{border:0;background:transparent;border-radius:9px;min-height:34px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{min-height:30px;font-size:13px}
.hb{flex:1;min-height:0;overflow:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pos{color:var(--greenTxt)}.neg{color:#B0241A}.zero{color:var(--mute)}
.ovlist{display:flex;flex-direction:column}
.ov{display:grid;grid-template-columns:34px minmax(0,1fr) 64px 60px;align-items:center;gap:10px;width:100%;min-height:60px;border:0;border-bottom:.5px solid var(--line);background:transparent;text-align:left;padding:6px 2px}
.ov b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov small{display:block;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov em{font-style:normal;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.ov .sp{display:block;width:64px;height:26px}
.hd-nav{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 -4px}
.hd-nav .link{padding:0;font-weight:600}
.hd-nav span{display:flex;gap:6px}
.hd-head{display:flex;align-items:center;gap:12px}
.hd-head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--plate);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;font-weight:600;color:var(--sub)}
.tile b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tile b u{text-decoration:none;font-size:13px;font-weight:600;color:var(--mute);margin-left:2px}
.tile span{font-size:12px;color:var(--mute)}
@media (min-width:460px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cbox{border:.5px solid var(--line);border-radius:16px;padding:10px 8px 4px;display:flex;flex-direction:column;gap:4px}
.ro{padding:0 6px;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums;min-height:38px}
.ro b{font-size:15px}.ro span{font-size:12px;color:var(--sub)}
.hc{display:block;touch-action:pan-y;cursor:crosshair}
.lgd{display:flex;gap:14px;padding:2px 6px 6px;font-size:11px;color:var(--mute);flex-wrap:wrap}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.sec{margin:6px 0 -6px;font-size:13px;font-weight:700;color:var(--sub)}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 6px;border:0;border-bottom:.5px solid var(--line);background:transparent;text-align:left;font-variant-numeric:tabular-nums;border-radius:0}
.srow.on{background:var(--plate);border-radius:12px;border-bottom-color:transparent}
.srow .d b{display:block;font-size:14px}.srow .d small{font-size:11px;color:var(--mute)}
.srow .s{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .s small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.srow .s small.miss{color:#9A3D00}
.srow .v{text-align:right}.srow .v b{display:block;font-size:15px}.srow .v small{font-size:11px;font-weight:700}
.hm{display:grid;grid-template-columns:16px;grid-template-rows:14px repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:var(--plate)}
.hm i.l1{background:#BCD6F5}.hm i.l2{background:#5E9BE4}.hm i.l3{background:var(--blue)}
.hm i.t{box-shadow:inset 0 0 0 1.5px var(--ink)}.hm i.f{background:transparent}
.hm i[data-d]{cursor:pointer}
.hm .hl{font-size:10px;line-height:14px;color:var(--mute);white-space:nowrap;overflow:visible}
.hleg{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--mute)}
.hleg i{display:block;width:10px;height:10px;border-radius:2px;background:var(--plate)}
.hleg i.l1{background:#BCD6F5}.hleg i.l2{background:#5E9BE4}.hleg i.l3{background:var(--blue)}
.dcard{border-bottom:.5px solid var(--line)}
.dcard>button{display:grid;grid-template-columns:62px minmax(0,1fr) auto 14px;gap:10px;align-items:center;width:100%;min-height:54px;border:0;background:transparent;text-align:left;padding:6px 2px}
.dcard .dd b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.dcard .dd small{font-size:11px;color:var(--mute)}
.dcard .dd small.t{color:var(--blue);font-weight:700}
.dcard .bars{gap:2px}.dcard .bars i{flex:1;height:6px;border-radius:2px}
.dcard em{font-style:normal;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.dcard .chev{transition:transform .15s;color:var(--mute)}
.dcard.open .chev{transform:rotate(90deg)}
.dbody{padding:0 0 10px}
.drow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:36px;font-size:14px;font-variant-numeric:tabular-nums;width:100%;border:0;background:transparent;text-align:left;padding:0 2px}
.drow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow span small{color:var(--sub);margin-left:6px;font-size:13px}
.drow em{font-style:normal;font-size:12px;font-weight:700}
.pr{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:#E6F4EA;color:var(--greenTxt);font-size:10px;font-weight:800;vertical-align:1px}
.empty{padding:28px 8px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}

/* folded outer screen / short screens */
@media (max-height:700px){.ctx h1{font-size:24px}.rule{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}:root{--pad:min(204px,56vw)}}
@media (max-height:620px){
  .extile{width:40px;height:40px;border-radius:12px}.extile .ic{width:30px;height:30px}
  .pageR{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .ctx{gap:4px}.ctx h1{font-size:21px}.setbars i{width:16px;height:5px}
  .hero{gap:6px;padding:4px 24px}
  .why{font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .delta{font-size:14px}
  .trend{display:none}
  .bottom{padding-top:6px}
  :root{--pad:min(180px,50vw)}
  .pad{padding:6px;gap:5px;border-radius:28px}.k{border-radius:18px}
  .lrow{padding:5px 0}.lrow b{font-size:15px}.lab{padding-bottom:3px}
  .next{margin-top:8px}
}

/* unfolded: two pages, hinge kept clear */
@media (min-width:560px) and (min-height:480px){
  .app{display:grid;grid-template-columns:minmax(220px,36fr) minmax(0,64fr);grid-template-rows:minmax(0,1fr);max-width:1100px;margin:0 auto}
  .pageL{gap:10px}
  .lp-head{flex-wrap:wrap;row-gap:2px}.lp-head h2{font-size:18px;white-space:nowrap}.lp-head span{font-size:12px;white-space:nowrap}
  .lp-trend .t1{flex-wrap:wrap;row-gap:2px}.lp-trend .t1 span{white-space:nowrap}
  .xrow{grid-template-columns:18px 24px minmax(0,1fr) auto;gap:8px;min-height:34px;font-size:14px;padding:0 4px}
  .xrow .ic{width:24px;height:24px}
  .xrow em{font-size:12px}
  .lp-trend .t1 b{font-size:14px}
  .lp-trend .why{font-size:12px}
  .lp-trend svg.big{height:110px!important}
  .pageL{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden;padding:calc(20px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom)) 16px;border-right:.5px solid var(--line)}
  .pageR .bottom{flex-direction:column;align-items:stretch;gap:12px;padding:12px 14px 0 24px}
  .pageR .side{max-width:none;flex:none}
  .pageR #ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pageR .lrow,.pageR .lrow:last-of-type{border:0;background:var(--plate);border-radius:12px;padding:8px 10px;flex-direction:column;align-items:flex-start;gap:2px}
  .pageR .lrow.c{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
  .pageR .next{display:none}
  .pageR .pad{align-self:flex-end}
  .pageR{max-width:none;margin:0;width:100%}
  .pageR .trend{display:none}
  .pageR .ctx .daypos,.pageR .ctx .daybars{display:none}
  .ctx{padding-top:6px}
  .lp-trend svg.big{height:150px}
}
/* rest timer: 레이아웃은 그대로, 배경이 차오르고 버튼·숫자·안내줄로 표시 */
.water{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:4;transition:height .3s linear}
.water[hidden]{display:none}
.water .wb{position:absolute;inset:0;background:rgba(10,102,209,.07)}
.water .wave{position:absolute;left:0;top:-7px;width:200%;height:8px;color:#0A66D1;animation:wv 4s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
.water .tag{position:absolute;left:16px;bottom:100%;margin-bottom:8px;padding:4px 11px;border-radius:999px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 8px rgba(10,102,209,.25)}
.water .tag small{font-size:11px;font-weight:700;opacity:.8;margin-left:4px}
.water.hi .tag{bottom:auto;top:10px;margin-bottom:0}
.water.end .wb{background:rgba(36,138,61,.08)}.water.end .wave,.water.end .tag{display:none}
.k.go{position:relative}
.k.go .rring,.k.go .rlbl{display:none}
body.rest-on .k.go:not(.next):not(.idle){background:#fff;color:var(--blue);box-shadow:0 0 0 1px #DCE9F9 inset}
body.rest-on .k.go:not(.next):not(.idle) #goIc{display:none}
body.rest-on .k.go:not(.next):not(.idle) .rring{display:block;position:absolute;inset:-3px;transform:rotate(-90deg);pointer-events:none}
body.rest-on .k.go:not(.next):not(.idle) .rlbl{display:flex;flex-direction:column;align-items:center;line-height:1}
.rlbl b{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rlbl small{font-size:10px;font-weight:700;color:var(--sub);margin-top:3px}
body.rest-end .k.go:not(.next):not(.idle){box-shadow:0 6px 14px rgba(10,102,209,.3),0 0 0 7px rgba(10,102,209,.18)}
body.rest-on #nums{opacity:.28;filter:saturate(.4)}
#nums{transition:opacity .3s}
.delta.rst{color:var(--blue)}.delta.rend{color:var(--greenTxt)}
.delta .rtx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta .tm{font-variant-numeric:tabular-nums;font-weight:800}.delta .rov{font-weight:600;opacity:.75}
#dayPos .rd{color:var(--blue)}#dayPos .rd.e{color:var(--greenTxt)}
.rmenu{position:fixed;z-index:8;display:flex;gap:4px;padding:5px;border-radius:18px;background:rgba(28,28,30,.95);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .15s ease-out}
.rmenu[hidden]{display:none}
.rmenu button{border:0;background:transparent;color:#fff;height:44px;padding:0 14px;border-radius:13px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rmenu button:active{background:rgba(255,255,255,.15)}.rmenu button[hidden]{display:none}
.sync .step button{background:#fff}
.step .val{width:72px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

        <button type="button" class="k arm" data-act="r+" id="kRup" aria-label="횟수 1회 늘리기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>회</button>
        <button type="button" class="k cor" id="kUndo" aria-label="방금 저장한 세트 되돌리기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
        <button type="button" class="k arm" data-act="w-" id="kWdn" aria-label="무게 1kg 내리기">kg<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="k cor" id="kList" aria-label="오늘 운동 목록"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      </div>

</div>

<div class="water" id="water" hidden aria-hidden="true"><div class="wb"></div><svg class="wave" viewBox="0 0 200 8" preserveAspectRatio="none"><path d="M0 4Q12.5 0 25 4T50 4T75 4T100 4T125 4T150 4T175 4T200 4V8H0Z" fill="currentColor" fill-opacity=".07"/><path d="M0 4Q12.5 0 25 4T50 4T75 4T100 4T125 4T150 4T175 4T200 4" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".6"/></svg><span class="tag" id="wTag"></span></div>

<script>
{
  'use strict';
  const KEY = 'dumbbell-custom-v1';
  const MIN_W = 3, MAX_W = 24, SETS = 3;
  const RATE = 0.02, REC_H = 48, REC_PEN = 0.02, BREAK_D = 14, DELOAD = 0.97, RMIN = 5, RMAX = 12, RMAX_LIGHT = 15;
  const WINDOW_DAYS = 56, EVAL_N = 6, THRESH = 0.5, FAST = 4, DONE_MS = 1600;

  /* 사용자 지정 순서. start = 10RM 무게(kg), bw = 맨몸(완료만 기록) */
  const EX = {
    frog:    { name: '프로그 펌프', short: '프로그 펌프', bw: true },
    chintuck:{ name: '친턱', short: '친턱', bw: true },
    sumo:    { name: '덤벨 스모 스쿼트', short: '스모 스쿼트', start: 20 },
    rdl:     { name: '루마니안 데드리프트', short: '루마니안 데드', start: 23 },
    lateral: { name: '레터럴 레이즈', short: '레터럴 레이즈', start: 8 },
    rcurl:   { name: '리버스 컬', short: '리버스 컬', start: 12 },
    row:     { name: '벤트오버 로우', short: '벤트오버 로우', start: 15 },
    crunch:  { name: '크런치', short: '크런치', start: 3 },
    rfly:    { name: '리버스 플라이', short: '리버스 플라이', start: 10 },
    wrist:   { name: '리스트 롤러', short: '리스트 롤러', start: 5 },
    curl:    { name: '바이셉 컬', short: '바이셉 컬', start: 8 },
    neck:    { name: '넥 컬', short: '넥 컬', bw: true },
    l2h:     { name: '로우 투 하이 플라이', short: '로우 투 하이', start: 4 }

  function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function seed() {
    const rnd = rng(7), now = new Date(), realToday = today, cap = {};
    ORDER.forEach((ex) => { if (!isBw(ex)) cap[ex] = EX[ex].start * 0.99; });
    for (let back = 24; back >= 1; back--) {
      const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back * 2, 19, 0, 0), ds = dstr(day);

  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => $('histBody').addEventListener(ev, () => { hDrag = false; }));
  window.addEventListener('resize', () => { if ($('hist').open) renderChartBox(); });

  /* ---------- 휴식 타이머 (끝나는 시각 기준 계산, data.json과 무관) ---------- */
  const RESTK = 'dumbbell-rest', RUNK = 'dumbbell-rest-run', OVER_MAX = 10 * 60e3;
  const restCfg = (() => { const d = { set: 90, ex: 120 }; try { const c = JSON.parse(lsGet(RESTK) || '{}'); if (Number.isFinite(c.set)) d.set = c.set; if (Number.isFinite(c.ex)) d.ex = c.ex; } catch (e) {} return d; })();
  let rest = (() => { try { const r = JSON.parse(lsGet(RUNK) || 'null'); return r && r.end > 0 && r.total > 0 ? r : null; } catch (e) { return null; } })();
  let restTick = null, restRang = !!(rest && rest.end <= Date.now()), actx = null, beeps = [], wake = null;
  const mmss = (sec) => Math.floor(sec / 60) + ':' + pad2(sec % 60);
  function audio() {
    try { if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (A) actx = new A(); } if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}
    return actx;
  }
  function cancelBeep() { beeps.forEach((o) => { try { o.stop(); o.disconnect(); } catch (e) {} }); beeps = []; }
  function scheduleBeep() {          /* 오디오 시계에 미리 예약 → 탭이 잠깐 가려져도 제시간에 울림 */
    cancelBeep(); const a = actx; if (!a || !rest) return;
    try {
      const t0 = a.currentTime + Math.max(0, (rest.end - Date.now()) / 1000);
      [0, 0.22, 0.44].forEach((d, i) => {
        const o = a.createOscillator(), g = a.createGain(), t = t0 + d;
        o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.18); beeps.push(o);
      });
    } catch (e) {}
  }
  async function lockWake() {       /* 앱이 화면에 떠 있는 동안 항상 화면 꺼짐 방지 (꺼지면 브라우저가 자동 해제, 다시 보이면 재요청) */
    try {
      if (!wake && navigator.wakeLock && !document.hidden) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    } catch (e) { wake = null; }
  }
  ['pointerdown', 'touchend', 'click'].forEach(t => document.addEventListener(t, () => { if (!wake) lockWake(); }, { passive: true }));

  /* 새 버전 자동 반영: 홈 화면 앱은 옛 화면을 계속 띄우므로, 열 때·다시 볼 때 서버의 index.html과 비교해 바뀌었으면 새로고침 */
  const codeSig = d => [...d.querySelectorAll('script,style')].map(n => n.textContent).join('\u0001');
  let updChecking = false, updLast = 0;
  async function checkUpdate() {
    if (updChecking || Date.now() - updLast < 15000 || !navigator.onLine) return;
    updChecking = true; updLast = Date.now();
    try {
      const res = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const txt = await res.text();
      const fresh = codeSig(new DOMParser().parseFromString(txt, 'text/html'));
      if (!fresh || fresh === codeSig(document)) return;
      let h = 0; for (let i = 0; i < fresh.length; i++) h = (h * 31 + fresh.charCodeAt(i)) | 0;
      const tag = (h >>> 0).toString(36);
      try { if (sessionStorage.getItem('dumbbell-upd') === tag) return; sessionStorage.setItem('dumbbell-upd', tag); } catch (e) {}
      saveLocal(); saveRun();
      location.replace(location.pathname + '?v=' + tag);
    } catch (e) {} finally { updChecking = false; }
  }
  const saveRun = () => lsSet(RUNK, rest ? JSON.stringify(rest) : '');
  function startRest(sec) {
    if (!(sec > 0)) { stopRest(); return; }
    audio();
    rest = { end: Date.now() + sec * 1000, total: sec * 1000 }; restRang = false;
    saveRun(); scheduleBeep(); drawRest();
  }
  function stopRest() { clearTimeout(restTick); closeRMenu(); if (!rest && $('water').hidden) return; rest = null; saveRun(); cancelBeep(); drawRest(); render(); }
  function adjRest(d) {
    if (!rest) return;
    const left = rest.end - Date.now(); if (left <= 0) return;
    const nl = Math.max(1000, left + d * 1000);
    rest.end = Date.now() + nl; rest.total = Math.max(rest.total + d * 1000, nl);
    saveRun(); scheduleBeep(); drawRest(); buzz(8);
  }
  $('kGo').insertAdjacentHTML('beforeend', '<svg class="rring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#DCE9F9" stroke-width="6"/><circle id="rArc" cx="50" cy="50" r="46" fill="none" stroke="#0A66D1" stroke-width="6" stroke-linecap="round" pathLength="100"/></svg><span class="rlbl" aria-hidden="true"><b id="rLbl"></b><small>휴식</small></span>');
  const restSec = () => Math.ceil((rest.end - Date.now()) / 1000);
  function restDecor() {             /* render()가 덮어쓴 글자를 휴식 표시로 바꿈 */
    if (!rest) return;
    const left = restSec(), ended = left <= 0, ex = curEx(), n = doneCount(ex);
    $('dayPos').innerHTML = ended ? '<b class="rd e">휴식 끝</b>' : '<b class="rd">휴식 ' + mmss(left) + '</b>';
    $('rLbl').textContent = mmss(Math.max(0, left));
    $('rArc').setAttribute('stroke-dasharray', Math.max(0, Math.min(100, left * 1000 / rest.total * 100)) + ' 100');
    if (n >= SETS) return;
    const dl = $('delta');
    dl.className = 'delta ' + (ended ? 'rend' : 'rst');
    dl.innerHTML = '<span class="rtx">' + (ended ? '✓ 휴식 끝 · ' + (n + 1) + '세트 시작 <span class="rov">+' + (-left) + '초</span>'
      : '⏱ 휴식 중 <span class="tm">' + mmss(left) + '</span> · 끝나면 ' + (isBw(ex) ? '시작' : '이 무게로')) + '</span>';
  }
  function drawRest() {
    const w = $('water'), B = document.body;
    clearTimeout(restTick); restTick = null;
    if (!rest) { w.hidden = true; B.classList.remove('rest-on', 'rest-end'); return; }
    const left = rest.end - Date.now();
    if (left <= -OVER_MAX) { stopRest(); return; }
    const ended = left <= 0, s = restSec();
    if (ended && !restRang) { restRang = true; closeRMenu(); if (!document.hidden) { buzz([200, 100, 200]); restart($('kGo'), 'pop'); } }
    B.classList.toggle('rest-on', !ended); B.classList.toggle('rest-end', ended);
    const h = ended ? 100 : Math.min(100, Math.max(0, (1 - left / rest.total) * 100));
    w.hidden = false; w.classList.toggle('end', ended); w.classList.toggle('hi', h > 85);
    w.style.height = h + '%';
    $('wTag').innerHTML = (s >= 60 ? Math.floor(s / 60) + '분' + (s % 60 ? ' ' + (s % 60) + '초' : '') : s + '초') + '<small>남음</small>';
    restDecor();
    restTick = setTimeout(drawRest, 250);
  }
  /* 휴식 중 완료 버튼 길게 누르기 → −15 / +15 / 끝 */
  let lpT = null, lpFired = false;
  function openRMenu() {
    if (!rest) return;
    const m = $('rmenu'), ended = rest.end <= Date.now();
    $('restM').hidden = ended; $('restP').hidden = ended; $('restX').textContent = ended ? '닫기' : '휴식 끝';
    m.hidden = false;
    const r = $('kGo').getBoundingClientRect(), mw = m.offsetWidth;
    m.style.left = Math.min(window.innerWidth - mw - 8, Math.max(8, r.left + r.width / 2 - mw / 2)) + 'px';
    m.style.top = Math.max(8, r.top - m.offsetHeight - 12) + 'px';
    buzz(20);
  }
  function closeRMenu() { $('rmenu').hidden = true; }
  $('kGo').addEventListener('pointerdown', () => { lpFired = false; clearTimeout(lpT); if (rest) lpT = setTimeout(() => { lpFired = true; openRMenu(); }, 450); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => $('kGo').addEventListener(ev, () => clearTimeout(lpT)));
  $('kGo').addEventListener('contextmenu', (e) => { if (rest) e.preventDefault(); });
  document.addEventListener('pointerdown', (e) => { if (!$('rmenu').hidden && !e.target.closest('#rmenu, #kGo')) closeRMenu(); });
  $('restM').addEventListener('click', () => { adjRest(-15); closeRMenu(); });
  $('restP').addEventListener('click', () => { adjRest(15); closeRMenu(); });
  $('restX').addEventListener('click', () => { stopRest(); buzz(10); });
  function drawRestCfg() {
    const f = (v) => (v ? (v >= 60 ? mmss(v) : v + '초') : '끔');
    $('rsSet').textContent = f(restCfg.set); $('rsEx').textContent = f(restCfg.ex);
  }
  document.querySelectorAll('[data-rs]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.rs.slice(0, -1), d = b.dataset.rs.slice(-1) === '+' ? 15 : -15;
    restCfg[k] = Math.min(600, Math.max(0, restCfg[k] + d));
    lsSet(RESTK, JSON.stringify(restCfg)); drawRestCfg(); buzz(6);
  }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !rest) return;
    if (rest.end <= Date.now()) cancelBeep(); else { audio(); scheduleBeep(); }
    drawRest();
  });

  /* ---------- boot ---------- */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (syncTimer) sync(); return; }
    lockWake(); checkUpdate();
    if (data.dayDate !== today()) { ensureDay(); hideDone(); prefill(); render(); }
    queueSync(300);
  });
  window.addEventListener('resize', () => { render(); });
  ensureDay();
  if (!(data.idx >= 0 && data.idx < ORDER.length)) data.idx = 0;
  prefill();
  render();
  drawRest(); lockWake();
  window.addEventListener('pageshow', e => { if (e.persisted) { lockWake(); checkUpdate(); } });
  window.addEventListener('focus', () => { lockWake(); checkUpdate(); });
  setTimeout(checkUpdate, 1500);
  if (/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname);
  queueSync(500);
}
</script>
</body>
</html>
