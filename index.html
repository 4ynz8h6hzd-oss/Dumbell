<style>
/* VOICE: 조용한 집중 — 지금 들 무게 하나만 크게
   IDEA: 운동기구 옆 기록 카드. 펼치면 왼쪽 페이지는 지도(순서·추세), 오른쪽 페이지는 지금 할 일
   PICTURE: 거대한 "20 kg × 9 회" + 오른쪽 아래 3×3 엄지 패드
   COLOUR/TYPE: 흰 바탕, 잉크 #1C1C1E, 행동=파랑, 향상=초록 / 시스템 산세리프 4단계
   LAYOUT: 접힘=한 열 압축, 기본=한 열, 펼침=두 페이지(가운데 접힘선 비움) */
:root{--bg:#FFFFFF;--ink:#1C1C1E;--sub:#6C6C70;--mute:#8E8E93;--faint:#C7C7CC;--line:#E5E5EA;--plate:#F2F2F7;--blue:#0A66D1;--green:#248A3D;--greenTxt:#1E6E31;--pad:min(234px,62vw)}
*{box-sizing:border-box;min-width:0;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(10,102,209,.45);outline-offset:2px}
.app{height:100vh;height:100dvh;touch-action:pan-y}
.pageL{display:none}
.pageR{position:relative;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom))}

/* context */
.ctx{padding:0 24px;display:flex;flex-direction:column;gap:8px;flex:none}
.ctx-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.daypos{border:0;background:transparent;padding:6px 0;font-size:13px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:4px}
.bars{display:flex;gap:4px}
.bars i{display:block;height:4px;border-radius:2px;background:var(--line)}
.bars i.d{background:var(--ink)}.bars i.c{background:var(--blue)}.bars i.p{background:#9A9AA0}
.daybars{width:150px;gap:3px}.daybars i{flex:1}
.ic{flex:none;display:block}.ic .a{fill:var(--ac)}
.exhead{display:flex;align-items:center;gap:12px}
.extile{flex:none;width:52px;height:52px;border-radius:15px;background:#EAF2FD;display:flex;align-items:center;justify-content:center}
.ctx h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.setrow{display:flex;align-items:center;gap:10px}
.setbars i{width:22px;height:6px;border-radius:3px}
.setrow span{font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.setrow .eta{margin-left:auto;font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}

/* hero */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:12px 24px;overflow:hidden}
.nums{display:flex;align-items:baseline;gap:.08em;font-size:104px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.nums input{width:1.2em;border:0;background:transparent;padding:0;font-size:1em;font-weight:700;letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;border-radius:12px;font-family:inherit}
.nums input::-webkit-outer-spin-button,.nums input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nums input:focus{background:var(--plate);outline:none}
.nums .u{font-size:.23em;font-weight:600;color:var(--mute);margin-right:.18em}
.nums .x{font-size:.38em;font-weight:300;color:var(--faint);margin:0 .12em 0 .02em}
.nums .bw{font-size:.62em;font-weight:800;letter-spacing:-.03em;line-height:1}
.nums .up{color:var(--green)}
.tick{animation:tick .18s ease-out}
@keyframes tick{from{transform:translateY(-5px);opacity:.6}to{transform:none;opacity:1}}
.delta{margin:0;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
.delta.bo{color:#0A4FA3}
.delta.up,.delta.same{color:var(--greenTxt)}.delta.hold{color:var(--ink)}.delta.down{color:#9A3D00}.delta.retry,.delta.first,.delta.bw{color:#0A4FA3}
.why{margin:0;font-size:13px;line-height:1.55;color:var(--sub)}
.delta .pct{font-style:normal;margin-left:4px;padding:1px 8px;border-radius:999px;box-shadow:inset 0 0 0 1.5px currentColor;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.why .ago{color:var(--mute)}
.rule{margin:0;font-size:12px;line-height:1.5;color:var(--sub)}.rule:empty{display:none}
.sgx{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--plate)}.sgx b{font-size:13px}.sgx p{margin:0;font-size:12px;line-height:1.55;color:var(--sub)}

/* trend row (single column only) */
.trend{flex:none;margin:0 24px;display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);background:transparent;text-align:left}
.trend b{font-size:12px;font-weight:700;white-space:nowrap}
.tk-cap{color:#5E4AB0}.tk-up{color:var(--greenTxt)}.tk-fast{color:#8A5A00}.tk-flat{color:#7A5600}.tk-down{color:#9A4A00}.tk-hold{color:var(--sub)}
.vstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.vstats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.vstats div{background:var(--plate);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;container-type:inline-size}
.vstats span{font-size:11px;color:var(--sub);white-space:nowrap}
.vstats b{font-size:min(17px,18cqi);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vscale{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.vbar{position:relative;display:flex;height:8px;border-radius:4px;overflow:visible}
.vbar i{height:100%;opacity:.22}.vbar i.on{opacity:.9}
.vbar i:first-child{border-radius:4px 0 0 4px}.vbar i:last-of-type{border-radius:0 4px 4px 0}
.z-down{background:#C26A00}.z-flat{background:#B07A00}.z-up{background:#248A3D}.z-fast{background:#C4281C}
.vbar em{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.vlab{display:flex;font-size:10px;color:var(--mute)}.vlab span{text-align:center;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
.trend svg{flex:1;height:24px}
.trend span{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}

/* bottom */
.bottom{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 14px 0 24px}
.side{flex:1;display:flex;flex-direction:column;align-self:stretch;max-width:150px}
.lab{font-size:12px;font-weight:600;color:var(--mute);padding-bottom:6px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:8px 0;border:0;border-top:.5px solid var(--line);background:transparent;font-variant-numeric:tabular-nums;text-align:left}
.lrow:last-of-type{border-bottom:.5px solid var(--line)}
.lrow small{font-size:12px;color:var(--mute)}
.lrow b{font-size:17px}
.lrow.c small,.lrow.c b{color:var(--blue)}
.lrow.e b{color:var(--faint)}
.next{margin:14px 0 0;font-size:12px;line-height:1.5;color:var(--mute)}
.next b{display:block;color:var(--ink);font-weight:600}

.pad{flex:none;width:var(--pad);height:var(--pad);padding:8px;border-radius:34px;background:var(--plate);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.k{border:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11px;font-weight:700;transition:background .1s,transform .1s}
.k.arm{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.k.arm:active,.k.arm.pressed{background:#E9E9EE;transform:scale(.96)}
.k.arm:disabled{background:transparent;color:var(--faint);box-shadow:none}
.k.cor{background:transparent;color:var(--mute)}
.k.cor:active{background:#E5E5EA}
.k.cor:disabled{opacity:.35}
.k.go{border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(10,102,209,.3)}
.k.go:active{transform:scale(.93)}
.k.go.next{background:var(--green);box-shadow:0 6px 14px rgba(36,138,61,.3),0 0 0 6px rgba(36,138,61,.14)}
.k.go.idle{background:var(--faint);box-shadow:none}
.k.hint{color:var(--green)}
.k.hint svg{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:none}}
.edge{animation:edge .22s}
@keyframes edge{0%,100%{transform:none}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.slide-n{animation:sn .28s ease-out}.slide-p{animation:sp .28s ease-out}
@keyframes sn{from{transform:translateX(36px);opacity:.2}to{transform:none;opacity:1}}
@keyframes sp{from{transform:translateX(-36px);opacity:.2}to{transform:none;opacity:1}}

/* done overlay */
.done{position:absolute;left:0;right:0;top:0;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 24px 0;display:flex;flex-direction:column;gap:16px;z-index:3;animation:fade .2s ease-out;overflow:hidden}
.done[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.done .chk{width:64px;height:64px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin-top:28px;flex:none;animation:pop .4s ease-out}
.done h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
.dsets{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.dsets div{display:flex;flex-direction:column;gap:2px}
.dsets small{font-size:12px;color:var(--mute)}
.dsets b{font-size:22px}
.dnext{margin-top:8px;padding:14px 16px;border-radius:18px;background:var(--plate);display:flex;align-items:center;gap:12px}
.dnext>div{flex:1}
.dnext small{display:block;font-size:12px;font-weight:600;color:var(--sub)}
.dnext b{font-size:18px}
.dnext em{font-style:normal;flex:none;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.dprog{height:3px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.dprog i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left;animation:prog 1.6s linear forwards}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* left page (unfolded) */
.lp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lp-head h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.lp-head span{font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.exlist{display:flex;flex-direction:column;overflow:auto;min-height:0}
.xrow{display:grid;grid-template-columns:20px 28px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:38px;border:0;border-bottom:.5px solid var(--line);background:transparent;text-align:left;padding:0 6px;border-radius:0;font-size:15px}
.xrow i{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.xrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow em{font-style:normal;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.xrow.ok span{color:var(--mute)}.xrow.ok em{color:var(--greenTxt);font-weight:700}
.xrow.cur{background:var(--plate);border-radius:12px;border-bottom-color:transparent}
.xrow.cur span{font-weight:700}.xrow.cur em{color:var(--blue);font-weight:700}
.lp-trend{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:.5px solid var(--line)}
.lp-trend .t1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lp-trend .t1 b{font-size:15px}
.lp-trend .t1 span{font-size:12px;color:var(--sub)}
.lp-trend svg{display:block}
.lp-trend[hidden],.rtrend[hidden]{display:none!important}
.chv{flex:none;color:var(--mute);transition:transform .2s}
[aria-expanded="true"]>.chv,[aria-expanded="true"] .chv{transform:rotate(180deg)}
.pageL .xrow .ti{width:24px;height:24px;border-radius:8px}.pageL .xrow .ti svg{width:14px;height:14px}
.pageL .xrow{grid-template-columns:18px 24px minmax(0,1fr) 24px;min-height:46px;padding:5px 4px}
.xrow .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.xrow .meta{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:500}
.xrow .meta em{font-size:12px}
.xrow b.pc{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;flex:none}
.xrow b.pc svg{display:block}
.ti{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;flex:none}
.ti-up{background:#E3F3E7;color:#248A3D}.ti-fast{background:#FDE7E5;color:#C4281C}.ti-flat{background:#FBF0D9;color:#9A6B00}.ti-down{background:#FCEBDD;color:#B05A00}.ti-hold{background:#F2F2F7;color:#8E8E93}.ti-cap{background:#ECE8FA;color:#6E56CF}
.wd{display:flex;flex-direction:column;gap:6px}.rtrend .wd{flex:none}
.wd div{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap}
.wd small{width:44px;flex:none;font-size:12px;font-weight:500;color:var(--sub)}
.nmore{font-size:13px;color:var(--sub)}
.nmore summary{cursor:pointer;font-weight:600;padding:8px 0;list-style:none;color:var(--blue)}
.nmore summary::-webkit-details-marker{display:none}
.nmore summary::after{content:' ›'}.nmore[open] summary::after{content:' ‹'}
.nmore>div{display:flex;flex-direction:column;gap:8px}
.xrow b.pc.tk-hold{font-weight:500;color:var(--faint)}
.xrow.ok b.pc{opacity:.75}
.cal{margin:0;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.45;color:var(--sub);font-variant-numeric:tabular-nums}
.cal b{color:var(--ink)}.cal em{font-style:normal;font-weight:700}
/* C: 접히는 추세 줄 */
.lt-line{display:flex;flex-direction:column;gap:4px;width:100%;border:0;background:transparent;padding:0;text-align:left}
.lt-line .r1{display:flex;align-items:center;gap:8px;width:100%}
.lt-line .r1 b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt-line .r2{display:flex;align-items:center;gap:10px;width:100%}
.lt-line .r2 svg{flex:1;height:22px}
.lt-line .r2 span{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.lt-line[aria-expanded="true"] .r2{display:none}
.lt-body{display:flex;flex-direction:column;gap:6px}
/* B: 오른쪽 추세 카드 */
.rtrend{display:none;flex:none;margin:0 14px 0 24px;flex-direction:column;gap:8px;padding:12px 16px;border:0;border-radius:18px;background:var(--plate);text-align:left}
.rtrend .r1{display:flex;align-items:center;gap:10px}
.rtrend .r1 b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtrend .r1 span{font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap}
.rtrend .r2{display:flex;align-items:center;gap:16px}
.rtrend .st{display:flex;gap:16px;flex:none}
.rtrend .st div{display:flex;flex-direction:column;gap:1px}
.rtrend .st small{font-size:11px;color:var(--sub);white-space:nowrap}
.rtrend .st b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtrend .r2 svg{flex:1;height:44px}

/* toast */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,calc(-100% - 60px));visibility:hidden;transition:transform .25s ease,visibility 0s .25s;z-index:10;background:rgba(28,28,30,.95);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease}

/* dialogs */
dialog{border:0;border-radius:22px;padding:0;width:min(400px,calc(100% - 24px));max-height:calc(100% - 48px);box-shadow:0 20px 50px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.3)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:17px;font-weight:700}
/* 우측 상단 닫기 — 작은 화면에서도 누르기 쉽게 44px + 바깥 여유 터치 영역 */
.dx{position:sticky;top:6px;z-index:2;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:6px 6px -50px auto;border-radius:50%;border:0;background:var(--plate);color:var(--ink);padding:0}
.dx::after,.hx::after{content:'';position:absolute;inset:-8px}
.dlg h2,.lh{padding-right:46px}.lh h2{padding-right:0;white-space:nowrap}
#todayBody,#whyBody,#trendBody{display:flex;flex-direction:column;gap:10px}
.dlg .sub{font-size:13px;color:var(--sub);margin-top:-10px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step label{font-size:15px;font-weight:600}
.step .ctl{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:0;background:var(--plate);font-size:20px;font-weight:600}
.step input{width:72px;height:44px;text-align:center;border:0;border-radius:12px;background:var(--plate);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{min-height:48px;border-radius:14px;border:0;font-size:16px;font-weight:600;background:var(--plate)}
.btn.pri{background:var(--blue);color:#fff}.btn.del{grid-column:1/-1;background:#FDECEA;color:#B0241A}.btn.wide{grid-column:1/-1}
.mood{display:flex;align-items:center;gap:10px;color:var(--ink);transition:color .5s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mood.skip b::after{content:' ›';opacity:.6}
.mood>i{flex:none;width:10px;height:10px;border-radius:50%;background:currentColor;animation:breathe 2.8s ease-in-out infinite}
.mood b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.mood span{display:block;font-size:13px;font-weight:600;line-height:1.35;color:var(--sub);font-variant-numeric:tabular-nums}.mood span:empty{display:none}
.mood.pos{color:#1E6E31}.mood.neu{color:#0A4FA3}.mood.neg{color:#9A3D00}.mood.warn{color:#B0241A}
.mood.warn>i{animation-duration:1.2s}
.mood.pop{animation:moodpop .45s ease-out}
@keyframes breathe{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.15);opacity:1}}
@keyframes moodpop{0%{transform:scale(.97);opacity:.6}100%{transform:none;opacity:1}}
.why{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}.why .ago{color:var(--sub)}
.rule{font-size:13px;font-variant-numeric:tabular-nums}
@media (max-height:700px){.mood b{font-size:19px}.mood span{font-size:13px}}
@media (max-height:620px){.mood b{font-size:18px}.mood span{display:none}}
.today{flex:none;margin:0 24px 8px;display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;border-radius:14px;background:var(--plate);text-align:left;color:var(--ink);font:inherit;transition:background-color .5s,color .5s}
.today>i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;animation:breathe 2.8s ease-in-out infinite}
.today b{flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.today span:empty{display:none}.today span{flex:none;font-size:12px;font-weight:600;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.today.pos{color:#1E6E31;background:#EEF7F0}.today.neu{color:#0A4FA3;background:#EEF4FC}.today.neg{color:#9A3D00;background:#FDF2EA}.today.warn{color:#B0241A;background:#FCEDEC}
.today.pop{animation:moodpop .5s ease-out}
.today.fin b{font-size:17px}
.fb{flex:none;margin:10px 14px 0 24px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:14px;background:var(--plate)}
.fb[hidden]{display:none}
.fb>span{flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--sub);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb>span b{display:block;font-size:13px;color:var(--ink)}
.fb button{flex:none;min-width:52px;height:36px;padding:0 10px;border:0;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;box-shadow:0 0 0 1px var(--line) inset}
.fb button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none}
.addset{margin:4px 0 0;display:flex;flex-direction:column;gap:2px;background:#E6F4EA;color:#1E6E31;font-weight:800}.addset small{font-size:12px;font-weight:600;opacity:.8}
.trows{display:flex;flex-direction:column;gap:2px;margin:6px 0 12px}
.trow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:13px}
.trow b{font-weight:700}.trow em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.trow small{grid-column:1/-1;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.c-pos{color:#1E6E31}.c-neu{color:#0A4FA3}.c-neg{color:#9A3D00}.c-warn{color:#B0241A}
.bump-up{animation:bumpUp .75s cubic-bezier(.2,.9,.3,1.2)}.bump-dn{animation:bumpDn .75s cubic-bezier(.2,.9,.3,1.2)}
@keyframes bumpUp{0%{transform:translateY(.25em) scale(.85);opacity:.3;color:#248A3D}45%{transform:translateY(-.06em) scale(1.08);opacity:1;color:#248A3D}100%{transform:none}}
@keyframes bumpDn{0%{transform:translateY(-.25em) scale(.85);opacity:.3;color:#0A66D1}45%{transform:translateY(.06em) scale(1.08);opacity:1;color:#0A66D1}100%{transform:none}}
.mood.pop{animation:moodin .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes moodin{0%{transform:translateY(10px);opacity:0}60%{transform:translateY(-2px);opacity:1}100%{transform:none}}
@media (max-height:620px){.today{padding:7px 12px;margin-bottom:4px}.today span{display:none}.fb{margin-top:6px}.fb button{height:32px}}
.hero>*{flex:none}
.hero.t1 .rule,.hero.t1 .mood span{display:none}
.hero.t2 .why{display:none}
.why[role=button]{cursor:pointer}.why .more{color:var(--blue);white-space:nowrap}
.steps{margin:6px 0 12px;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:st;display:grid;grid-template-columns:22px 1fr;column-gap:8px;font-size:13px;line-height:1.5;color:var(--sub)}
.steps li::before{content:counter(st);grid-row:span 2;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps b{color:var(--ink);font-size:13px}
.trend-more{margin:0;font-size:12px;line-height:1.6;color:var(--sub)}
.link{border:0;background:transparent;color:var(--blue);font-size:14px;min-height:44px}
.sync{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--plate)}
.sync-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sync-h b{font-size:15px}.sync-h span{font-size:12px;color:var(--sub);text-align:right}
.sync-h span.err{color:#B0241A;font-weight:600}
.sync-f{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.sync-f input{height:44px;border:0;border-radius:12px;background:#fff;padding:0 12px;font-size:15px}
.sync-f .btn{min-height:44px;padding:0 16px}
.sync-a{display:flex;justify-content:space-between}
.sync-a[hidden],.sync-f[hidden]{display:none}
.snd{display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-radius:14px;background:var(--plate)}
.snd b{font-size:15px}
.smix{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--plate)}
.smix-h{display:flex;justify-content:space-between;align-items:baseline}
.smix-h label{font-size:15px;font-weight:700}
.smix-h span{font-size:13px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.smix input{width:100%;margin:0;accent-color:var(--blue)}
.smix-e{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}

/* history (read-only) */
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 12px;border:0;border-radius:17px;background:#EAF2FD;color:var(--blue);font-size:13px;font-weight:700;white-space:nowrap}
.lh{display:flex;justify-content:space-between;align-items:center;gap:10px}
#hist{width:100%;max-width:640px;height:100%;max-height:none;margin:0 auto;border-radius:0;box-shadow:none;background:var(--bg);overflow:hidden}
#hist[open]{display:flex;flex-direction:column}
#hist::backdrop{background:var(--bg)}
.hh{flex:none;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:.5px solid var(--line)}
.hh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hh-top h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.hx{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--plate);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.hx:disabled{opacity:.35}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:2px;border-radius:11px;background:var(--plate)}
.seg button{border:0;background:transparent;border-radius:9px;min-height:34px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{min-height:30px;font-size:13px}
.hb{flex:1;min-height:0;overflow:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pos{color:var(--greenTxt)}.neg{color:#B0241A}.zero{color:var(--mute)}
.ovlist{display:flex;flex-direction:column}
.ov{display:grid;grid-template-columns:34px minmax(0,1fr) 64px 60px;align-items:center;gap:10px;width:100%;min-height:60px;border:0;border-bottom:.5px solid var(--line);background:transparent;text-align:left;padding:6px 2px}
.ov b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov small{display:block;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov em{font-style:normal;text-align:right;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.ov .sp{display:block;width:64px;height:26px}
.hd-nav{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 -4px}
.hd-nav .link{padding:0;font-weight:600}
.hd-nav span{display:flex;gap:6px}
.hd-head{display:flex;align-items:center;gap:12px}
.hd-head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--plate);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;font-weight:600;color:var(--sub)}
.tile b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tile b u{text-decoration:none;font-size:13px;font-weight:600;color:var(--mute);margin-left:2px}
.tile span{font-size:12px;color:var(--mute)}
@media (min-width:460px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cbox{border:.5px solid var(--line);border-radius:16px;padding:10px 8px 4px;display:flex;flex-direction:column;gap:4px}
.ro{padding:0 6px;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums;min-height:38px}
.ro b{font-size:15px}.ro span{font-size:12px;color:var(--sub)}
.hc{display:block;touch-action:pan-y;cursor:crosshair}
.lgd{display:flex;gap:14px;padding:2px 6px 6px;font-size:11px;color:var(--mute);flex-wrap:wrap}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.sec{margin:6px 0 -6px;font-size:13px;font-weight:700;color:var(--sub)}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 6px;border:0;border-bottom:.5px solid var(--line);background:transparent;text-align:left;font-variant-numeric:tabular-nums;border-radius:0}
.srow.on{background:var(--plate);border-radius:12px;border-bottom-color:transparent}
.srow .d b{display:block;font-size:14px}.srow .d small{font-size:11px;color:var(--mute)}
.srow .s{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .s small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.srow .s small.miss{color:#9A3D00}
.srow .v{text-align:right}.srow .v b{display:block;font-size:15px}.srow .v small{font-size:11px;font-weight:700}
.hm{display:grid;grid-template-columns:16px;grid-template-rows:14px repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:var(--plate)}
.hm i.l1{background:#BCD6F5}.hm i.l2{background:#5E9BE4}.hm i.l3{background:var(--blue)}
.hm i.t{box-shadow:inset 0 0 0 1.5px var(--ink)}.hm i.f{background:transparent}
.hm i[data-d]{cursor:pointer}
.hm .hl{font-size:10px;line-height:14px;color:var(--mute);white-space:nowrap;overflow:visible}
.hleg{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--mute)}
.hleg i{display:block;width:10px;height:10px;border-radius:2px;background:var(--plate)}
.hleg i.l1{background:#BCD6F5}.hleg i.l2{background:#5E9BE4}.hleg i.l3{background:var(--blue)}
.dcard{border-bottom:.5px solid var(--line)}
.dcard>button{display:grid;grid-template-columns:62px minmax(0,1fr) auto 14px;gap:10px;align-items:center;width:100%;min-height:54px;border:0;background:transparent;text-align:left;padding:6px 2px}
.dcard .dd b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.dcard .dd small{font-size:11px;color:var(--mute)}
.dcard .dd small.t{color:var(--blue);font-weight:700}
.dcard .bars{gap:2px}.dcard .bars i{flex:1;height:6px;border-radius:2px}
.dcard em{font-style:normal;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.dcard .chev{transition:transform .15s;color:var(--mute)}
.dcard.open .chev{transform:rotate(90deg)}
.dbody{padding:0 0 10px}
.drow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:36px;font-size:14px;font-variant-numeric:tabular-nums;width:100%;border:0;background:transparent;text-align:left;padding:0 2px}
.drow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow span small{color:var(--sub);margin-left:6px;font-size:13px}
.drow em{font-style:normal;font-size:12px;font-weight:700}
.pr{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:6px;background:#E6F4EA;color:var(--greenTxt);font-size:10px;font-weight:800;vertical-align:1px}
.empty{padding:28px 8px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}

/* folded outer screen / short screens */
@media (max-height:700px){.ctx h1{font-size:24px}.rule{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}:root{--pad:min(204px,56vw)}}
@media (max-height:620px){
  .extile{width:40px;height:40px;border-radius:12px}.extile .ic{width:30px;height:30px}
  .pageR{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .ctx{gap:4px}.ctx h1{font-size:21px}.setbars i{width:16px;height:5px}
  .hero{gap:6px;padding:4px 24px}
  .why{font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .delta{font-size:14px}
  .trend{display:none}
  .bottom{padding-top:6px}
  :root{--pad:min(180px,50vw)}
  .pad{padding:6px;gap:5px;border-radius:28px}.k{border-radius:18px}
  .lrow{padding:5px 0}.lrow b{font-size:15px}.lab{padding-bottom:3px}
  .next{margin-top:8px}
}

/* unfolded: two pages, hinge kept clear */
@media (min-width:560px) and (min-height:480px){
  .app{display:grid;grid-template-columns:minmax(220px,36fr) minmax(0,64fr);grid-template-rows:minmax(0,1fr);max-width:1100px;margin:0 auto}
  .pageL{gap:10px}
  .lp-head{flex-wrap:wrap;row-gap:2px}.lp-head h2{font-size:18px;white-space:nowrap}.lp-head span{font-size:12px;white-space:nowrap}
  .lp-trend .t1{flex-wrap:wrap;row-gap:2px}.lp-trend .t1 span{white-space:nowrap}
  .xrow{grid-template-columns:18px 24px minmax(0,1fr) auto;gap:8px;min-height:34px;font-size:14px;padding:0 4px}
  .xrow .ic{width:24px;height:24px}
  .xrow em{font-size:12px}
  .lp-trend .t1 b{font-size:14px}
  .lp-trend .why{font-size:12px}
  .lp-trend svg.big{height:110px!important}
  .pageL{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden;padding:calc(20px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom)) 16px;border-right:.5px solid var(--line)}
  .pageR .bottom{flex-direction:column;align-items:stretch;gap:12px;padding:12px 14px 0 24px}
  .pageR .side{max-width:none;flex:none}
  .pageR #ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pageR .lrow,.pageR .lrow:last-of-type{border:0;background:var(--plate);border-radius:12px;padding:8px 10px;flex-direction:column;align-items:flex-start;gap:2px}
  .pageR .lrow.c{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
  .pageR .next{display:none}
  .pageR .pad{align-self:flex-end}
  .pageR{max-width:none;margin:0;width:100%}
  .pageR .trend{display:none}
  .pageR .ctx .daypos,.pageR .ctx .daybars{display:none}
  .ctx{padding-top:6px}
  .lp-trend svg.big{height:150px}
}
/* 세로로 긴 펼친 화면은 추세를 오른쪽 빈자리로 */
@media (min-width:560px) and (min-height:860px){
  .rtrend{display:flex}
  .lp-trend{display:none}
}
/* 펼친 가로 화면: 엄지 패드가 잘리지 않게 세트 칸을 패드 왼쪽으로 */
@media (min-width:560px) and (min-height:480px) and (max-height:760px){
  .pageR .bottom{flex-direction:row;align-items:flex-end}
  .pageR .side{flex:1;align-self:flex-end}
  .pageR #ledger{grid-template-columns:minmax(0,1fr)}
  .pageR .lrow,.pageR .lrow:last-of-type{flex-direction:row;align-items:baseline;gap:10px}
  .hero{gap:8px}
}
/* rest timer: 레이아웃은 그대로, 배경이 차오르고 버튼·숫자·안내줄로 표시 */
.water{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:4;transition:height .3s linear}
.water[hidden]{display:none}
.water .wb{position:absolute;inset:0;background:rgba(10,102,209,.07)}
.water .wave{position:absolute;left:0;top:-7px;width:200%;height:8px;color:#0A66D1;animation:wv 4s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
.water .tag{display:none!important;position:absolute;left:16px;bottom:100%;margin-bottom:8px;padding:4px 11px;border-radius:999px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 8px rgba(10,102,209,.25)}
.water .tag small{font-size:11px;font-weight:700;opacity:.8;margin-left:4px}
.water.hi .tag{bottom:auto;top:10px;margin-bottom:0}
.water.end .wb{background:rgba(36,138,61,.08)}.water.end .wave,.water.end .tag{display:none}
.k.go{position:relative}
.k.go .rring,.k.go .rlbl{display:none}
body.rest-on .k.go:not(.next):not(.idle){background:#fff;color:var(--blue);box-shadow:0 0 0 1px #DCE9F9 inset}
body.rest-on .k.go:not(.next):not(.idle) #goIc{display:none}
body.rest-on .k.go:not(.next):not(.idle) .rring{display:block;position:absolute;inset:-3px;transform:rotate(-90deg);pointer-events:none}
body.rest-on .k.go:not(.next):not(.idle) .rlbl{display:flex;flex-direction:column;align-items:center;line-height:1}
.rlbl b{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rlbl small{font-size:15px;font-weight:800;color:var(--blue);letter-spacing:-.02em}
.rring{opacity:.5}
body.rest-end .k.go:not(.next):not(.idle){box-shadow:0 6px 14px rgba(10,102,209,.3),0 0 0 7px rgba(10,102,209,.18)}
body.rest-on #nums{opacity:.55}
#nums{transition:opacity .3s}
.delta.rst{color:var(--blue)}.delta.rend{color:var(--greenTxt)}
.delta .rtx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta .tm{font-variant-numeric:tabular-nums;font-weight:800}.delta .rov{font-weight:600;opacity:.75}
#dayPos .rd{color:var(--blue)}#dayPos .rd.e{color:var(--greenTxt)}
.rmenu{position:fixed;z-index:8;display:flex;gap:4px;padding:5px;border-radius:18px;background:rgba(28,28,30,.95);box-shadow:0 10px 30px rgba(0,0,0,.25);animation:fade .15s ease-out}
.rmenu[hidden]{display:none}
.rmenu button{border:0;background:transparent;color:#fff;height:44px;padding:0 14px;border-radius:13px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rmenu button:active{background:rgba(255,255,255,.15)}.rmenu button[hidden]{display:none}
.sync .step button{background:#fff}
.step .val{width:72px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="pageL" id="pageL" aria-label="오늘 운동 순서와 추세">

    <button type="button" class="pill" id="histOpenL" style="align-self:flex-start"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg>지난 기록 · 그래프</button>
    <div class="bars daybars" id="lpBars" aria-hidden="true" style="width:100%"></div>

    <div class="lp-trend" id="lpTrend"></div>
  </aside>

  <div class="pageR" id="pageR">
    <header class="ctx" id="ctx">
      <div class="ctx-top">
        <button type="button" class="daypos" id="dayPos" aria-label="오늘 운동 목록 열기"></button>
        <div class="bars daybars" id="dayBars" aria-hidden="true"></div>
      </div>
      <div class="exhead"><div class="extile" id="exTile"></div><h1 id="exName"></h1></div>
      <div class="setrow"><div class="bars setbars" id="setBars" aria-hidden="true"></div><span id="setTxt"></span><span class="eta" id="eta"></span></div>
    </header>

    <section class="hero" id="hero" aria-label="이번 세트">
      <div class="mood" id="mood" aria-live="polite" role="button" tabindex="0" aria-label="오늘 운동 현황 보기"><i aria-hidden="true"></i><div><b id="moodT"></b><span id="moodS"></span></div></div>
      <div class="nums" id="nums"></div>
      <p class="delta" id="delta"></p>
      <p class="why" id="why" role="button" tabindex="0" aria-label="판단 근거 보기"></p>
      <p class="rule" id="rule"></p>
    </section>

    <button type="button" class="trend" id="trend"></button>
    <button type="button" class="rtrend" id="rTrend"></button>
    <div class="fb" id="fb" hidden role="group" aria-label="방금 세트 여유"></div>

    <section class="bottom">
      <div class="side">
        <span class="lab">오늘 세트</span>
        <div id="ledger"></div>
        <p class="next" id="next"></p>
      </div>
      <div class="pad" id="pad" role="group" aria-label="엄지 패드">
        <button type="button" class="k cor" id="kPrev" aria-label="이전 운동"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
        <button type="button" class="k arm" data-act="w+" id="kWup" aria-label="무게 1kg 올리기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>kg</button>
        <button type="button" class="k cor" id="kNext" aria-label="다음 운동"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
        <button type="button" class="k arm" data-act="r-" id="kRdn" aria-label="횟수 1회 줄이기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>회</button>
        <button type="button" class="k go" id="kGo" aria-label="세트 완료"><svg id="goIc" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <button type="button" class="k arm" data-act="r+" id="kRup" aria-label="횟수 1회 늘리기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>회</button>
        <button type="button" class="k cor" id="kUndo" aria-label="방금 저장한 세트 되돌리기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
        <button type="button" class="k arm" data-act="w-" id="kWdn" aria-label="무게 1kg 내리기">kg<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" class="k cor" id="kList" aria-label="오늘 운동 목록"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      </div>
    </section>

    <div class="done" id="done" hidden></div>
  </div>
</div>

<div class="water" id="water" hidden aria-hidden="true"><div class="wb"></div><svg class="wave" viewBox="0 0 200 8" preserveAspectRatio="none"><path d="M0 4Q12.5 0 25 4T50 4T75 4T100 4T125 4T150 4T175 4T200 4V8H0Z" fill="currentColor" fill-opacity=".07"/><path d="M0 4Q12.5 0 25 4T50 4T75 4T100 4T125 4T150 4T175 4T200 4" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".6"/></svg><span class="tag" id="wTag"></span></div>
<div class="rmenu" id="rmenu" role="menu" hidden><button type="button" role="menuitem" id="restM">−15초</button><button type="button" role="menuitem" id="restP">+15초</button><button type="button" role="menuitem" id="restX">휴식 끝</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="edit" aria-labelledby="editT">
  <form method="dialog" class="dlg">
    <h2 id="editT">세트 수정</h2>
    <div class="sub" id="editSub"></div>

    <div class="step" id="eRrow"><label for="eR">횟수</label><div class="ctl"><button type="button" data-e="r-" aria-label="횟수 1회 줄이기">−</button><input id="eR" type="number" inputmode="numeric" min="1" max="100" step="1"><button type="button" data-e="r+" aria-label="횟수 1회 늘리기">+</button></div></div>
    <div class="btns">
      <button type="button" class="btn" id="eCancel">취소</button>
      <button type="button" class="btn pri" id="eSave">저장</button>
      <button type="button" class="btn del" id="eDel">이 세트 삭제</button>
    </div>
  </form>
</dialog>

<dialog id="list" aria-labelledby="listT">
  <div class="dlg">
    <div class="lh"><h2 id="listT">운동 목록</h2><button type="button" class="pill" id="histOpen"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg>지난 기록 · 그래프</button></div>
    <div class="sub">운동을 누르면 바로 이동해요.</div>

      <div class="sync-f" id="syncForm">
        <input type="password" id="tokIn" placeholder="GitHub 토큰 붙여넣기" autocomplete="off" aria-label="GitHub 토큰">
        <button type="button" class="btn pri" id="tokSave">연결</button>

        <button type="button" class="link" id="syncNow">지금 저장</button>
        <button type="button" class="link" id="tokOff">연결 해제</button>

      <div class="step"><label>운동 사이</label><div class="ctl"><button type="button" data-rs="ex-" aria-label="운동 사이 휴식 15초 줄이기">−</button><span class="val" id="rsEx"></span><button type="button" data-rs="ex+" aria-label="운동 사이 휴식 15초 늘리기">+</button></div></div>

      <button type="button" class="btn" id="bkLoad">백업 불러오기</button>
    </div>
    <input type="file" id="bkFile" accept=".json,application/json" hidden>
  </div>
</dialog>

<dialog id="todayDlg" aria-labelledby="todayT">
  <div class="dlg">
    <h2 id="todayT">오늘 운동 현황</h2>
    <div id="todayBody"></div>
  </div>
</dialog>
<dialog id="whyDlg" aria-labelledby="whyT">
  <div class="dlg">
    <h2 id="whyT">판단 근거</h2>
    <div id="whyBody"></div>
  </div>

  const agoTxt = (h) => (h < 1 ? '방금' : h < 72 ? Math.round(h) + '시간 전' : Math.round(h / 24) + '일 전');

  /* ---------- day fatigue: today's shortfall vs expectation (P) carries into later exercises ---------- */
  const MUSCLE = { frog: ['둔근'], chintuck: ['목'], sumo: ['대퇴사두', '둔근', '내전근'], rdl: ['햄스트링', '둔근', '척추기립근', '악력'],
    lateral: ['측면 어깨'], rcurl: ['이두', '전완', '악력'], row: ['등', '후면 어깨', '이두', '악력'], crunch: ['복근'], rfly: ['후면 어깨', '등'],
    wrist: ['전완', '악력'], curl: ['이두', '전완'], neck: ['목'], l2h: ['가슴', '전면 어깨'] };
  function dayFatigue(ex) {
    const list = [];
    ORDER.forEach((e) => {
      if (e === ex || isBw(e)) return;
      const xs = todaySets(e).filter((s) => typeof s.P === 'number' && s.P > 0);
      if (!xs.length) return;
      const dev = xs.reduce((a, s) => a + Math.min(0, eff(s) / s.P - 1), 0) / xs.length;
      list.push({ e, dev, ov: (MUSCLE[e] || []).filter((m) => (MUSCLE[ex] || []).includes(m)) });
    });
    const ovl = list.filter((x) => x.ov.length), worst = ovl.length ? ovl.reduce((a, x) => (x.dev < a.dev ? x : a)) : null;
    const loc = worst ? worst.dev : 0, sys = list.length ? DAY_SYS * list.reduce((a, x) => a + x.dev, 0) / list.length : 0;
    let f = Math.max(DAY_FLOOR, 1 + Math.min(loc, sys));
    if (f > 0.99) f = 1;
    let txt;
    if (!list.length) txt = '오늘 앞서 한 무게 운동이 아직 없어서 조정 없음';
    else if (f === 1) txt = Math.min(loc, sys) < -1e-4 ? '오늘 앞선 운동 피로 ' + sgn(100 * Math.min(loc, sys)) + '% · 1% 미만이라 조정 없음' : '오늘 앞선 ' + list.length + '개 운동이 예상대로라서 조정 없음';
    else if (worst && loc <= sys) txt = EX[worst.e].short + '(같은 근육: ' + worst.ov.join('·') + ')에서 예상보다 ' + sgn(100 * loc) + '% → 목표 ' + sgn(100 * (f - 1)) + '%';
    else txt = '오늘 앞선 ' + list.length + '개 운동이 평균 ' + sgn(100 * sys / DAY_SYS) + '% (다른 근육이라 절반만 반영) → 목표 ' + sgn(100 * (f - 1)) + '%';
    return { f, txt };
  }

  /* 기준 재설정(기술·자세 변경): R 표시된 1세트가 있는 세션부터만 진도/학습에 사용 */
  const CAP = 0.05;   /* 그날 목표보다 +5%까지만 다음 기준으로 인정, 넘는 부분은 다음 세션에서 한 번 더 나와야 인정 */
  function sessCut(ex, excludeToday) {
    const ss = sessions(ex, excludeToday), i = ss.findIndex((x) => x.sets[0] && x.sets[0].R);
    return i < 0 ? ss : ss.slice(0, i + 1);
  }
  const resetPending = (ex) => !!(data.rp && data.rp[ex] === today());
  /* 시작 기준 맞추기: 운동별 처음 CALIB_N 세션(기준 재설정 후 포함)의 1세트는 여유 있으면 1회 남을 때까지 → 입력한 10RM이 낮아도 빨리 따라잡음 */
  const CALIB_N = 2;
  const calib = (ex) => !isBw(ex) && sessCut(ex, true).length < CALIB_N;
  function suggest(ex, nowMs) {
    const now = nowMs || Date.now(), ssAll = sessions(ex, true), ss = sessCut(ex, true);
    if (!isBw(ex) && resetPending(ex) && ssAll.length) {
      const f = ssAll[0].sets[0], b = e10(f.w, f.r) * 0.92, pk = steps(f.w, 0, b)[0];
      return { kind: 'down', w: pk.w, r: pk.r, T: pk.e, step: pct(pk.e, e10(f.w, f.r)), mode: 'reset', delta: '기준 재설정 · 편하게 ' + pk.r + '회', why: '기술을 바꿔서 기준을 다시 잡아요.', note: '', prev: null, reset: true,
        expl: [['기준 재설정', '기술·자세를 바꿔서 이전 기록은 진도 계산에서 빼요'], ['오늘 1세트', '마지막 기록(' + f.w + '×' + f.r + ')의 92%로 편하게 시작 → 오늘 1세트 결과가 새 기준이 돼요']], title: '1세트 (기준 재설정)', last: '' };
    }
    if (isBw(ex)) {
      return { kind: 'bw', w: 0, r: 0, delta: '맨몸 · 완료만 체크', why: '무게와 횟수 없이 세트를 마칠 때마다 가운데 버튼만 누르면 돼요.', last: ss.length ? '지난번 ' + md(ss[0].date) + ' · ' + ss[0].sets.length + '세트 완료' : '' };
    }
    const hist = ss.map((s) => { const f = s.sets[0], l = s.sets[s.sets.length - 1];
      return { date: s.date, w: f.w, r: f.r, q: f.q, T: f.T, all: s.sets, e: eff(f), start: f.ts, end: l.ts, drop: s.sets.length > 1 ? 1 - eff(l) / eff(f) : null }; });
    /* 이상치: 목표보다 +5% 넘게 나온 1세트는 +5%까지만 기준으로, 바로 이전 세션도 그랬으면(확인됨) 그대로 인정 */
    hist.forEach((h) => { h.raw = h.e; });
    hist.forEach((h, i) => { const o = hist[i + 1], hi = (x) => x && typeof x.T === 'number' && x.raw > x.T * (1 + CAP);
      if (hi(h) && !hi(o)) { h.e = h.T * (1 + CAP); h.capped = true; } });
    if (!hist.length) {
      const st = EX[ex].start, pick = { w: st, r: 10, e: st };
      return { kind: 'same', w: st, r: 10, T: st, step: 0, delta: '입력한 10RM으로 시작', prev: null, note: '첫 기록이에요. 입력한 10RM ' + st + 'kg × 10회로 시작해요.', why: '첫 기록이라 입력한 10RM 그대로 시작해요.', last: '' };
    }
    const last = hist[0], hrs = (now - last.end) / 36e5;
    const miss = (i) => !!hist[i] && typeof hist[i].T === 'number' && hist[i].e < hist[i].T - 1e-6;
    /* level anchor: when the current level was first reached */
    let ai = 0; while (hist[ai + 1] && hist[ai + 1].e >= last.e - 1e-6) ai++;
    const lvlDays = (now - hist[ai].start) / 864e5;
    /* fatigue signals */
    const drops = hist.slice(1, 7).map((h) => h.drop).filter((d) => d !== null);
    const typ = drops.length >= 2 ? median(drops) : null;
    /* 누적 피로: 백오프 세트가 휴식까지 반영한 예상(P)보다 평균 4% 넘게 못했을 때. P 없는 옛 기록만 감소율 비교 */
    const bo = last.all.slice(1).filter((x) => x.P > 0);
    const boDev = bo.length ? bo.reduce((a, x) => a + Math.min(0, eff(x) / x.P - 1), 0) / bo.length : null;
    const fDrop = boDev !== null ? boDev < -0.04 : !last.capped && typ !== null && last.drop !== null && last.drop > typ + 0.04;
    const mine = data.sets.filter((s) => s.ex === ex && s.ts <= now && s.date !== today());
    const oldest = mine.reduce((m, s) => Math.min(m, s.ts), now);
    /* 운동량 비교: 예상보다 +JUMP 넘게 튄 세트(오타 가능)는 빼고, 이전 3주는 기록 있는 주만 평균 (쉰 주가 섞이면 복귀 직후가 '평소의 몇 배'로 잘못 잡힘) */
    const volOk = mine.filter((s) => !(s.P > 0 && e10(s.w, s.r) / s.P - 1 > JUMP));
    const v7 = vol(volOk.filter((s) => s.ts > now - 7 * 864e5));
    const wks = [1, 2, 3].map((k) => vol(volOk.filter((s) => s.ts <= now - k * 7 * 864e5 && s.ts > now - (k + 1) * 7 * 864e5))).filter((v) => v > 0);
    const vPrev = wks.length ? wks.reduce((a, v) => a + v, 0) / wks.length : 0;
    /* 최근 4주 안에 7일 넘게 쉰 적이 있으면 비교 기준 주가 덜 찬 주라서 '평소의 몇 배'가 부풀려짐 → 운동량 신호 끔 (복귀는 break 모드가 따로 낮춤) */
    const gap = hist.some((h, i) => hist[i + 1] && h.start > now - 28 * 864e5 && h.start - hist[i + 1].end > 7 * 864e5);
    const loadX = now - oldest >= 21 * 864e5 && vPrev > 0 && !gap ? v7 / vPrev : 0, fLoad = loadX > 1.5;

    const RT = exRate(ex).r;
    let mode = 'normal', P = last.e, g = RT * Math.min(lvlDays, 14) / 7;
    if (hrs > BREAK_D * 24) { mode = 'break'; P = last.e * DELOAD; g = 0; }
    else if (miss(0) && miss(1)) { mode = 'deload'; P = last.e * DELOAD; g = 0; }
    else if (fDrop || fLoad) { mode = 'fatigue'; g = 0; }
    else if (miss(0)) { mode = 'easy'; g /= 2; }
    const pen = mode === 'break' || hrs >= REC_H ? 0 : REC_PEN * (1 - Math.max(0, hrs) / REC_H);
    const day = dayFatigue(ex);
    const goal = P * (1 + g - pen) * day.f;
    /* 튄 기록(capped)은 그 자리에 묶지 않고 인정한 기준에서 가장 가까운 무게×횟수로 */
    /* 1세트가 RMIN회 미만이면 그 자리 유지(r0)를 허용하지 않음: RMIN 아래 횟수는 후보가 안 돼서 다음 진도가 영영 75%를 못 넘고 멈춤 → 1kg 내려 횟수 확보 */
    const low = last.r < RMIN;
    const r0 = mode === 'deload' || mode === 'break' || last.capped || low ? 0 : last.r, um = UP_MIN[EX[ex].type || 'f'];
    const cands = steps(last.w, r0, goal, um), pick = cands[0];
    /* 회복·오늘 피로 조정이 실제 무게×횟수를 바꿨나? (1회도 안 바뀌는 조정은 화면에 알리지 않음) */
    const pick0 = pen > 0 || day.f < 1 ? steps(last.w, r0, P * (1 + g), um)[0] : pick;
    const adjAct = pick0.w !== pick.w || pick0.r !== pick.r;
    /* 장비 한계: 가장 무거운 덤벨에서 CAP_R회 이상 → 무게로는 더 못 올림 */
    const atMax = last.w >= MAX_W, maxed = atMax && last.r >= CAP_R;
    const step = pct(pick.e, last.e);
    let kind, delta;
    if (pick.w > last.w) { kind = 'up'; delta = '1kg 올리고 ' + pick.r + '회'; }
    else if (pick.w < last.w) { kind = 'down'; delta = '1kg 내리고 ' + pick.r + '회'; }
    else if (pick.r > last.r) { kind = 'up'; delta = '지난번보다 ' + (pick.r - last.r) + '회 더'; }
    else if (pick.r < last.r) { kind = 'down'; delta = '지난번보다 ' + (last.r - pick.r) + '회 덜'; }
    else { kind = 'hold'; delta = '지난번과 같게'; }
    const up = pick.e > last.e + 1e-9;
    const note = mode === 'break' ? Math.round(hrs / 24) + '일 만이라 조금 가볍게 다시 시작해요'
      : mode === 'deload' ? '2번 연속 목표를 못 채워서 한 번 쉬어가요'
      : mode === 'fatigue' ? (fDrop ? '지난번 세트마다 횟수가 평소보다 많이 줄었어요 · 이번엔 유지' : '최근 일주일 운동량이 평소보다 많아요 · 이번엔 유지')
      : low && pick.w < last.w ? '지난번 ' + last.r + '회라 ' + RMIN + '회보다 적어요 · 1kg 내려서 횟수를 확보해요'
      : mode === 'easy' ? '지난번 목표를 못 채워서 이번엔 천천히 올려요'
      : !up && adjAct && pen > 0.004 ? '회복 ' + REC_H + '시간 중 ' + Math.max(0, Math.round(hrs)) + '시간 · 무리하지 않게 잡았어요'
      : !up ? '아직 이 무게에 익숙해지는 중 · 며칠 더 하면 올려요' : '';
    const why = '지난 세션(' + md(last.date) + ') 첫 세트 ' + last.w + '×' + last.r + ' = 추정 10RM ' + f1(last.e) + 'kg' +
      (mode === 'break' || mode === 'deload' ? ' → 3% 낮춤' : ' → 이 레벨 ' + lvlDays.toFixed(1) + '일째, 주 ' + rp(RT) + ' 속도' + (mode === 'easy' ? '의 절반' : '') + ' ' + sgn(g * 100) + '%') +
      (mode === 'fatigue' ? ' → 피로 신호로 0%' : '') +
      (pen > 0 ? ' → 회복 ' + Math.round(hrs) + '/' + REC_H + '시간 −' + (pen * 100).toFixed(1) + '%' : '') +
      (day.f < 1 ? ' → 오늘 피로 ' + sgn(100 * (day.f - 1)) + '%' : '') +
      ' → 목표 ' + f1(goal) + 'kg → ' + (up ? pick.w + '×' + pick.r + ' (' + sgn(step) + '%)' : '다음 진도의 75%에 못 미쳐서 ' + pick.w + '×' + pick.r + ' 유지');
    const others = cands.slice(1, 4).map((c) => c.w + '×' + c.r + ' ' + sgn(pct(c.e, last.e)) + '%');
    const lastLine = '지난 세션: ' + last.all.map((s) => s.w + '×' + s.r).join(' · ');
    const expl = [
      ['기준', '지난 세션(' + md(last.date) + ', ' + agoTxt(hrs) + ') 첫 세트 ' + last.w + 'kg × ' + last.r + '회 = 추정 10RM ' + f1(last.raw) + 'kg' +
        (last.q === 1 ? ' (여유 있음 → 1회 더 한 것으로 계산)' : last.q === -1 ? ' (한계 → 0.5회 덜 한 것으로 계산)' : '') +
        (last.capped ? ' → 목표보다 ' + sgn(pct(last.raw, last.T)) + '%라 +5%까지만 인정, ' + f1(last.e) + 'kg (다음에도 비슷하면 그대로 인정)' : '')],
      ['진도', mode === 'break' ? Math.round(hrs / 24) + '일 만이라 3% 낮춰서 다시 시작' : mode === 'deload' ? '2번 연속 목표 미달 → 3% 낮춰서 다시'
        : mode === 'fatigue' ? (fDrop ? (boDev !== null ? '지난번 2·3세트가 휴식 반영 예상보다 평균 ' + sgn(100 * boDev) + '%' : '지난번 세트 간 횟수 감소가 평소보다 큼') : '최근 7일 운동량이 평소의 ' + loadX.toFixed(1) + '배') + ' → 이번엔 0%'
        : '이 레벨 ' + lvlDays.toFixed(1) + '일째 × 주 ' + rp(RT) + ' 속도' + (mode === 'easy' ? '의 절반(지난번 목표 미달)' : '') + ' → ' + sgn(g * 100) + '%'],
      ['회복', mode === 'break' ? '—' : hrs >= REC_H ? '마지막 세트 후 ' + Math.round(hrs) + '시간 · ' + REC_H + '시간 회복 완료' : '마지막 세트 후 ' + Math.round(hrs) + '/' + REC_H + '시간 · 덜 회복된 만큼 −' + (pen * 100).toFixed(1) + '%'],
      ['오늘 피로', day.txt],
      ['결정', '목표 추정 10RM ' + f1(goal) + 'kg → ' + (up ? '가장 가까운 진도 ' + pick.w + 'kg × ' + pick.r + '회 (' + sgn(step) + '%)' : '다음 진도의 75%에 못 미쳐서 ' + pick.w + 'kg × ' + pick.r + '회 유지') +
        (others.length ? ' · 다른 후보 ' + others.join(', ') : '')]
    ];
    if (maxed) expl.push(['장비 한계', '가장 무거운 덤벨(' + MAX_W + 'kg)에서 ' + last.r + '회 · 무게로는 더 못 올려서 횟수만 늘고 있어요. 3초에 걸쳐 내리기나 바닥에서 1초 정지로 바꾸고 아래 \'기준 재설정\'을 누르면 다시 ' + RMIN + '~' + RMAX + '회 구간에서 진도를 잴 수 있어요']);
    const plain = [
      ['지난번', md(last.date) + ' 첫 세트 ' + last.w + 'kg × ' + last.r + '회' + (last.q === 1 ? ' · 여유 있었어요' : last.q === -1 ? ' · 한계였어요' : '') + (last.capped ? ' · 평소보다 너무 잘 나와서 일부만 인정했어요' : '')],
      ['진도', mode === 'break' ? Math.round(hrs / 24) + '일 만이라 조금 가볍게 다시 시작해요'
        : mode === 'deload' ? '2번 연속 목표를 못 채워서 한 번 가볍게 쉬어가요'
        : mode === 'fatigue' ? (fDrop ? '지난번 뒤 세트들이 평소보다 많이 떨어졌어요 · 이번엔 유지' : '최근 일주일 운동량이 평소보다 많아요 · 이번엔 유지')
        : mode === 'easy' ? '지난번 목표를 조금 못 채워서 천천히 올려요'
        : lvlDays < 1 ? '이 기록을 막 세웠어요' : '이 기록을 ' + Math.round(lvlDays) + '일째 유지 중 · 오래 할수록 올릴 힘이 쌓여요'],
      ['회복', pen > 0 && adjAct ? '지난 운동 후 아직 덜 쉬어서 살짝 낮췄어요' : pen > 0 ? '조금 덜 쉬었지만 무게는 그대로예요' : '충분히 쉬었어요'],
      ['오늘 컨디션', day.f < 1 && adjAct ? '앞에서 한 운동 피로가 있어서 살짝 낮췄어요' : day.f < 1 ? '앞선 운동 피로가 조금 있지만 무게는 그대로예요' : '앞선 운동 영향 없어요'],
      ['결정', maxed ? '가장 무거운 덤벨이라 횟수로만 진도를 내요 · ' + pick.w + 'kg × ' + pick.r + '회' : up ? '한 단계 올려서 ' + pick.w + 'kg × ' + pick.r + '회' : '아직 올릴 만큼 쌓이지 않아서 ' + pick.w + 'kg × ' + pick.r + '회 그대로']

      last: [lastLine, others.length ? '다른 후보: ' + others.join(', ') : ''].filter(Boolean).join('  ·  ') };
  }

  /* ---------- back-off sets (2·3세트): 직전 세트 실제 결과 + 실제 휴식 시간으로 매번 다시 계산 ---------- */

  function histDays() {

  /* ---------- 휴식 타이머 (끝나는 시각 기준 계산, data.json과 무관) ---------- */
  const RESTK = 'dumbbell-rest', RUNK = 'dumbbell-rest-run', OVER_MAX = 10 * 60e3;
  const restCfg = (() => { const d = { set: 90, ex: 120 }; try { const c = JSON.parse(lsGet(RESTK) || '{}'); if (Number.isFinite(c.set)) d.set = c.set; if (Number.isFinite(c.ex)) d.ex = c.ex; } catch (e) {} return d; })();
  let rest = (() => { try { const r = JSON.parse(lsGet(RUNK) || 'null'); return r && r.end > 0 && r.total > 0 ? r : null; } catch (e) { return null; } })();
  let restTick = null, restRang = !!(rest && rest.end <= Date.now()), actx = null, beeps = [], wake = null;
  const mmss = (sec) => Math.floor(sec / 60) + ':' + pad2(sec % 60);
  function audio() {

  async function lockWake() {       /* 앱이 화면에 떠 있는 동안 항상 화면 꺼짐 방지 (꺼지면 브라우저가 자동 해제, 다시 보이면 재요청) */

  /* 새 버전 자동 반영: 홈 화면 앱은 옛 화면을 계속 띄우므로, 열 때·다시 볼 때 서버의 index.html과 비교해 바뀌었으면 새로고침 */
  const codeSig = d => [...d.querySelectorAll('script,style')].map(n => n.textContent).join('\u0001');
  let updChecking = false, updLast = 0;
  async function checkUpdate() {
    if (updChecking || Date.now() - updLast < 15000 || !navigator.onLine) return;
    updChecking = true; updLast = Date.now();
    try {
      const res = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const txt = await res.text();
      const fresh = codeSig(new DOMParser().parseFromString(txt, 'text/html'));
      if (!fresh || fresh === codeSig(document)) return;
      let h = 0; for (let i = 0; i < fresh.length; i++) h = (h * 31 + fresh.charCodeAt(i)) | 0;
      const tag = (h >>> 0).toString(36);
      try { if (sessionStorage.getItem('dumbbell-upd') === tag) return; sessionStorage.setItem('dumbbell-upd', tag); } catch (e) {}
      saveLocal(); saveRun();
      location.replace(location.pathname + '?v=' + tag);
    } catch (e) {} finally { updChecking = false; }

  /* ---------- 효과음: 거대한 외계 구조물의 공명 (Web Audio로 합성, 파일 없음) ----------

  const SNDK = 'dumbbell-sound', SMIXK = 'dumbbell-sound-mix';
  let soundOn = lsGet(SNDK) !== 'off', sfxP = null;
  let sMixF = (() => { const v = parseInt(lsGet(SMIXK), 10); return isNaN(v) ? 70 : Math.min(100, Math.max(0, v)); })();
  const og = () => (1 - sMixF / 100) * 2, fg = () => (sMixF / 100) / 0.7;
  function sNoise(dur) { const a = actx, n = Math.floor(a.sampleRate * dur) + 1, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return b; }
  function sfxBus(verb, echo) {
    const a = actx;
    if (!sfxP) {
      const comp = a.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
      const out = a.createGain(); out.gain.value = 1; out.connect(comp); comp.connect(a.destination);
      const n = Math.floor(a.sampleRate * 3.2), ir = a.createBuffer(2, n, a.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2); }
      const cv = a.createConvolver(); cv.buffer = ir; const vlp = a.createBiquadFilter(); vlp.type = 'lowpass'; vlp.frequency.value = 1800;
      const vin = a.createGain(); vin.connect(cv); cv.connect(vlp); vlp.connect(out);
      const ein = a.createGain(), dl = a.createDelay(2), fb = a.createGain(), lp = a.createBiquadFilter();
      dl.delayTime.value = 0.42; fb.gain.value = 0.35; lp.type = 'lowpass'; lp.frequency.value = 1200;
      ein.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(vin); lp.connect(out);
      sfxP = { out, vin, ein };
    }
    const g = a.createGain(); g.connect(sfxP.out);
    if (verb) { const s = a.createGain(); s.gain.value = verb; g.connect(s); s.connect(sfxP.vin); }
    if (echo) { const s = a.createGain(); s.gain.value = echo; g.connect(s); s.connect(sfxP.ein); }
    return g;
  }
  function sEnv(e, t, g, at, d) { e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(Math.max(g, 0.0002), t + at); e.gain.exponentialRampToValueAtTime(0.0001, t + at + d); }
  function sOsc(t, f, to, g, at, d, out, sw) {
    const a = actx, o = a.createOscillator(), e = a.createGain();
    o.frequency.setValueAtTime(f, t); if (to && to !== f) o.frequency.exponentialRampToValueAtTime(to, t + (sw || d * 0.7));
    sEnv(e, t, g, at, d); o.connect(e); e.connect(out); o.start(t); o.stop(t + at + d + 0.05);
  }
  function sub(t, f, to, g, d, out) { if (g >= 0.001) sOsc(t, f, to, g, 0.012, d, out); }
  function hum(t, f, g, d, out, at) {   /* 거의 같은 음 여러 개 → 천천히 일렁이는 맥놀이 */
    if (g >= 0.001) [[1, 1], [1.004, 0.8], [2.003, 0.35], [2.997, 0.15]].forEach(([r, k]) => sOsc(t, f * r, 0, g * k, at || 0.04, d, out));
  }
  function metal(t, f, g, d, out, at) { /* 비정수배 배음: 거대한 금속 주발 */
    if (g >= 0.001) [[1, 1, 1], [2.76, 0.45, 0.6], [5.4, 0.2, 0.4], [8.93, 0.08, 0.25]].forEach(([r, k, dk]) => sOsc(t, f * r, 0, g * k, at || 0.006, d * dk, out));
  }
  function cavity(t, f, g, d, out) {    /* 잡음 한 번 → 짧은 지연 되먹임: 속 빈 거대한 공간이 우는 소리 */
    if (g < 0.001) return;
    const a = actx, s = a.createBufferSource(), bl = a.createBiquadFilter(), e = a.createGain(), dl = a.createDelay(0.1), fb = a.createGain(), lp = a.createBiquadFilter(), o = a.createGain();
    s.buffer = sNoise(0.03); bl.type = 'lowpass'; bl.frequency.value = 900; sEnv(e, t, 1, 0.003, 0.025);
    dl.delayTime.value = 1 / f; lp.type = 'lowpass'; lp.frequency.value = f * 6;
    fb.gain.setValueAtTime(0.97, t); fb.gain.linearRampToValueAtTime(0, t + d); o.gain.value = g;
    s.connect(bl); bl.connect(e); e.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(o); o.connect(out);
    s.start(t); s.stop(t + 0.05);
    setTimeout(() => { try { lp.disconnect(); fb.disconnect(); o.disconnect(); } catch (x) {} }, (t - a.currentTime + d + 0.3) * 1000);
  }
  function breath(t, g, d, out, f1, f2, at) { /* organic: 포먼트 걸린 숨결 */
    if (g < 0.001) return;
    const a = actx, s = a.createBufferSource(), e = a.createGain(); s.buffer = sNoise(d + at + 0.1);
    sEnv(e, t, g, at, d); s.connect(e);
    [[f1, 1], [f2, 0.6]].forEach(([f, k]) => { const b = a.createBiquadFilter(), m = a.createGain(); b.type = 'bandpass'; b.Q.value = 9; b.frequency.setValueAtTime(f, t); b.frequency.exponentialRampToValueAtTime(f * 0.8, t + at + d); m.gain.value = k * 3; e.connect(b); b.connect(m); m.connect(out); });
    s.start(t); s.stop(t + at + d + 0.1);
  }
  function stone(t, f, g, d, out) {     /* organic: 둔한 돌·나무 몸통 */
    if (g < 0.001) return;
    const a = actx; sOsc(t, f, f * 0.7, g, 0.004, d, out, 0.1);
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), n = a.createGain();
    s.buffer = sNoise(0.06); fl.type = 'lowpass'; fl.frequency.value = 600; sEnv(n, t, g * 0.4, 0.004, 0.05);
    s.connect(fl); fl.connect(n); n.connect(out); s.start(t); s.stop(t + 0.08);
  }
  const SFX = {
    rep: (t) => { const o = sfxBus(0.25); metal(t, 1180, 0.035 * fg(), 0.35, o); stone(t, 300, 0.05 * og(), 0.05, o); },
    wup: (t) => { const o = sfxBus(0.3); sub(t, 62, 50, 0.3 * fg(), 0.35, o); metal(t, 330, 0.035 * fg(), 0.5, o); stone(t, 90, 0.14 * og(), 0.1, o); },   /* 무거워질수록 낮게 */
    wdn: (t) => { const o = sfxBus(0.3); sub(t, 82, 92, 0.26 * fg(), 0.3, o); metal(t, 440, 0.035 * fg(), 0.45, o); stone(t, 120, 0.12 * og(), 0.1, o); },
    edge: (t) => { const o = sfxBus(0.2); cavity(t, 46, 0.5 * fg(), 0.5, o); stone(t, 60, 0.25 * og(), 0.14, o); },
    nav: (t) => { const o = sfxBus(0.4); hum(t, 73, 0.1 * fg(), 0.5, o, 0.03); breath(t, 0.07 * og(), 0.35, o, 380, 900, 0.06); metal(t, 587, 0.02 * fg(), 0.6, o, 0.02); },
    set1: (t) => { const o = sfxBus(0.5, 0.18); sub(t, 55, 46, 0.42 * fg(), 0.7, o); cavity(t, 110, 0.35 * fg(), 1.2, o); metal(t, 220, 0.05 * fg(), 1.6, o); stone(t, 70, 0.3 * og(), 0.18, o); breath(t, 0.05 * og(), 0.5, o, 500, 1200, 0.01); },
    set2: (t) => { const o = sfxBus(0.5, 0.18); sub(t, 62, 52, 0.42 * fg(), 0.7, o); cavity(t, 123, 0.35 * fg(), 1.2, o); metal(t, 247, 0.05 * fg(), 1.6, o); stone(t, 78, 0.3 * og(), 0.18, o); breath(t, 0.05 * og(), 0.5, o, 520, 1250, 0.01); },
    ex: (t) => { const o = sfxBus(0.6, 0.25); sub(t, 49, 41, 0.45 * fg(), 1.4, o); hum(t, 82.4, 0.09 * fg(), 2.2, o, 0.15); hum(t, 123.5, 0.05 * fg(), 2.2, o, 0.2);
      metal(t, 165, 0.06 * fg(), 2.4, o); stone(t, 62, 0.32 * og(), 0.22, o); breath(t, 0.06 * og(), 1.4, o, 600, 1000, 0.25); },
    all: (t) => { const o = sfxBus(0.7, 0.3); sub(t, 41, 36, 0.5 * fg(), 2.6, o); cavity(t, 55, 0.4 * fg(), 2.5, o);
      [55, 82.4, 110, 164.8].forEach((f, i) => hum(t, f, (0.08 - i * 0.012) * fg(), 3.2, o, 0.4)); metal(t, 110, 0.06 * fg(), 3.5, o); metal(t, 165, 0.04 * fg(), 3, o);
      stone(t, 55, 0.35 * og(), 0.3, o); breath(t, 0.07 * og(), 2.6, o, 700, 1150, 0.6); },
    undo: (t) => { const o = sfxBus(0.35); sub(t, 98, 58, 0.25 * fg(), 0.4, o); metal(t, 392, 0.03 * fg(), 0.5, o); breath(t, 0.05 * og(), 0.25, o, 900, 400, 0.02); },
    rest: (t, o) => { o = o || sfxBus(0.55, 0.5); sub(t, 55, 55, 0.4 * fg(), 0.9, o); metal(t, 330, 0.09 * fg(), 2.2, o); metal(t, 495, 0.05 * fg(), 1.8, o); stone(t, 70, 0.3 * og(), 0.2, o); },
  };
  function sfx(k) {
    const a = actx;
    if (!soundOn || !a || !SFX[k]) return;
    if (a.state !== 'running') a.resume().catch(() => {});
    try { SFX[k](a.currentTime + 0.005); } catch (e) {}
  }
  const padSfx = (act) => (act === 'w+' ? 'wup' : act === 'w-' ? 'wdn' : 'rep');
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => window.addEventListener(ev, audio, { capture: true, passive: true }));
  const showSnd = () => { const b = $('sndTog'); b.textContent = soundOn ? '켜짐' : '꺼짐'; b.setAttribute('aria-pressed', String(soundOn)); };
  $('sndTog').addEventListener('click', () => { soundOn = !soundOn; lsSet(SNDK, soundOn ? '' : 'off'); showSnd(); sfx('set1'); });
  const showMix = () => { $('sndMix').value = sMixF; $('sndMixV').textContent = 'organic ' + (100 - sMixF) + ' : ' + sMixF + ' futuristic'; };
  $('sndMix').addEventListener('input', () => { sMixF = +$('sndMix').value; showMix(); });
  $('sndMix').addEventListener('change', () => { lsSet(SMIXK, String(sMixF)); sfx('set1'); });
  showMix();
  showSnd();

  /* ---------- boot ---------- */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (syncTimer) sync(); return; }
    lockWake(); checkUpdate();
    if (data.dayDate !== today()) { ensureDay(); hideDone(); prefill(); render(); }
    queueSync(300);
  });
  window.addEventListener('resize', () => { render(); });
  ensureDay();
  if (!(data.idx >= 0 && data.idx < ORDER.length)) data.idx = 0;
  prefill();
  render();
  drawRest(); lockWake();
  window.addEventListener('pageshow', e => { if (e.persisted) { lockWake(); checkUpdate(); } });
  window.addEventListener('focus', () => { lockWake(); checkUpdate(); });
  setTimeout(checkUpdate, 1500);
  if (/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname);
  queueSync(500);
}
</script>
</body>
